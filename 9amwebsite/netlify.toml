[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://nineamleads-backend.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/blog"
  to = "https://nineamleads-backend.onrender.com/blog"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "https://nineamleads-backend.onrender.com/blog/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/success-centre"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/success-centre/*"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/how-it-works"
  to = "/how-it-works/index.html"
  status = 200

[[redirects]]
  from = "/how-it-works/*"
  to = "/how-it-works/:splat"
  status = 200

[[redirects]]
  from = "/who-we-serve"
  to = "/who-we-serve/index.html"
  status = 200

[[redirects]]
  from = "/who-we-serve/*"
  to = "/who-we-serve/:splat"
  status = 200

[[redirects]]
  from = "/founder"
  to = "/founder/index.html"
  status = 200

[[redirects]]
  from = "/founder/*"
  to = "/founder/:splat"
  status = 200

[[redirects]]
  from = "/portal/*"
  to = "https://nineamleads-backend.onrender.com/portal/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/portal"
  to = "https://nineamleads-backend.onrender.com/portal/"
  status = 200
  force = true

[[redirects]]
  from = "/movingleadsdaily"
  to = "/movingleadsdaily/index.html"
  status = 200

[[redirects]]
  from = "/movingleadsdaily/*"
  to = "/movingleadsdaily/:splat"
  status = 200

[[redirects]]
  from = "/probateleads"
  to = "/probateleads/index.html"
  status = 200

[[redirects]]
  from = "/probateleads/*"
  to = "/probateleads/:splat"
  status = 200

[[redirects]]
  from = "/newbusinessalert"
  to = "/newbusinessalert/index.html"
  status = 200

[[redirects]]
  from = "/newbusinessalert/*"
  to = "/newbusinessalert/:splat"
  status = 200

[[redirects]]
  from = "/planningleads"
  to = "/planningleads/index.html"
  status = 200

[[redirects]]
  from = "/planningleads/*"
  to = "/planningleads/:splat"
  status = 200

[[redirects]]
  from = "/tenders"
  to = "/tenders/index.html"
  status = 200

[[redirects]]
  from = "/tenders/*"
  to = "/tenders/:splat"
  status = 200

# Proxy the blog (generated by the backend) so /blog/ and /blog/:slug work
[[redirects]]
  from = "/blog/*"
  to = "https://nineamleads-backend.onrender.com/blog/:splat"
  status = 200

[[redirects]]
  from = "/blog"
  to = "https://nineamleads-backend.onrender.com/blog"
  status = 200

# Proxy the rich dynamic sitemap generated by the backend
[[redirects]]
  from = "/sitemap.xml"
  to = "https://nineamleads-backend.onrender.com/sitemap.xml"
  status = 200

# Real 404 for unknown URLs (avoids soft-404s and homepage duplicate content)
[[redirects]]
  from = "/about"
  to = "/how-it-works/"
  status = 301

[[redirects]]
  from = "/about/"
  to = "/how-it-works/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/portal/enquiry.html"
  status = 301

[[redirects]]
  from = "/contact/"
  to = "/portal/enquiry.html"
  status = 301

[[redirects]]
  from = "/cookies.html"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
