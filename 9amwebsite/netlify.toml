[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://nineamleads-api.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/founder"
  to = "/founder/index.html"
  status = 200

[[redirects]]
  from = "/founder/*"
  to = "/founder/:splat"
  status = 200

[[redirects]]
  from = "/portal"
  to = "/portal/index.html"
  status = 200

[[redirects]]
  from = "/portal/*"
  to = "/portal/:splat"
  status = 200

[[redirects]]
  from = "/movingleadsdaily"
  to = "/movingleadsdaily/index.html"
  status = 200

[[redirects]]
  from = "/movingleadsdaily/*"
  to = "/movingleadsdaily/:splat"
  status = 200

[[redirects]]
  from = "/probateleads"
  to = "/probateleads/index.html"
  status = 200

[[redirects]]
  from = "/probateleads/*"
  to = "/probateleads/:splat"
  status = 200

[[redirects]]
  from = "/newbusinessalert"
  to = "/newbusinessalert/index.html"
  status = 200

[[redirects]]
  from = "/newbusinessalert/*"
  to = "/newbusinessalert/:splat"
  status = 200

[[redirects]]
  from = "/planningleads"
  to = "/planningleads/index.html"
  status = 200

[[redirects]]
  from = "/planningleads/*"
  to = "/planningleads/:splat"
  status = 200

[[redirects]]
  from = "/tenders"
  to = "/tenders/index.html"
  status = 200

[[redirects]]
  from = "/tenders/*"
  to = "/tenders/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
