<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password | 9amLeads</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;background:#11131f;border:1px solid #1e2030;border-radius:20px;padding:40px 36px;text-align:center}
h1{font-size:22px;font-weight:800;font-family:'Outfit',sans-serif;margin-bottom:6px}
.sub{color:#8890a8;font-size:14px;margin-bottom:28px;line-height:1.6}
.form-group{margin-bottom:16px;text-align:left}
.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:#c8cbd6;text-transform:uppercase;letter-spacing:.5px}
.form-group input{width:100%;padding:13px 16px;background:#0f111a;border:1px solid #1e2030;border-radius:10px;font-size:14px;font-family:inherit;color:#f1f5f9;transition:border-color .2s;outline:none}
.form-group input:focus{border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,0.08)}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all .3s;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(14,165,233,0.25)}
.msg{font-size:13px;margin-top:12px;padding:10px 14px;border-radius:8px;display:none}
.msg-error{color:#ef4444;background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.1)}
.msg-success{color:#22c55e;background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.1)}
.footer-text{margin-top:20px;font-size:12px;color:#5c6480}
.footer-text a{color:#0ea5e9;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<h1>Reset Password</h1>
<p class="sub">Enter your new password below.</p>
<div class="form-group"><label>New Password</label><input type="password" id="password" placeholder="Min 8 characters" minlength="8" onkeydown="if(event.key==='Enter')resetPassword()"></div>
<div id="msg" class="msg"></div>
<button class="btn" onclick="resetPassword()">Reset Password</button>
<div class="footer-text"><a href="/portal/">Back to Sign In</a></div>
</div>

<script>
const API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? 'http://localhost:8012'
  : 'https://www.9amleads.com';

async function resetPassword() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  msg.style.display = 'none';

  if (!token) { msg.textContent = 'Invalid reset link. Please request a new one.'; msg.className = 'msg msg-error'; msg.style.display = 'block'; return; }
  if (!password || password.length < 8) { msg.textContent = 'Password must be at least 8 characters'; msg.className = 'msg msg-error'; msg.style.display = 'block'; return; }

  try {
    const r = await fetch(API + '/api/auth/reset-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password })
    });
    const d = await r.json();
    if (d.message) {
      msg.textContent = d.message + ' Redirecting to sign in...';
      msg.className = 'msg msg-success';
      msg.style.display = 'block';
      setTimeout(() => window.location.href = '/portal/', 2000);
    } else {
      msg.textContent = d.error || 'Reset failed. Please request a new link.';
      msg.className = 'msg msg-error';
      msg.style.display = 'block';
    }
  } catch {
    msg.textContent = 'Could not connect to server. Please try again.';
    msg.className = 'msg msg-error';
    msg.style.display = 'block';
  }
}
</script>
</body></html>
