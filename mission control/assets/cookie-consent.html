<div id="cookie-banner" style="position:fixed;bottom:0;left:0;right:0;background:#0f172a;color:#fff;padding:16px 24px;z-index:99999;display:none;font-family:Arial,sans-serif;font-size:14px;box-shadow:0 -4px 20px rgba(0,0,0,0.3);">
  <div style="max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
    <div style="flex:1;min-width:200px;">
      <strong style="color:#fff;">🍪 We use cookies</strong>
      <p style="margin:4px 0 0;color:#94a3b8;font-size:13px;">This site uses cookies to improve your experience. By continuing you agree to our <a href="/privacy.html" style="color:#60a5fa;text-decoration:underline;">Privacy Policy</a>.</p>
    </div>
    <div style="display:flex;gap:8px;flex-shrink:0;">
      <button onclick="acceptCookies()" style="background:#3b82f6;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;">Accept All</button>
      <button onclick="declineCookies()" style="background:transparent;color:#94a3b8;border:1px solid #334155;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:13px;">Essential Only</button>
    </div>
  </div>
</div>
<script>
function acceptCookies() { localStorage.setItem('cookieConsent','accepted'); document.getElementById('cookie-banner').style.display='none'; }
function declineCookies() { localStorage.setItem('cookieConsent','declined'); document.getElementById('cookie-banner').style.display='none'; }
if (!localStorage.getItem('cookieConsent')) { document.getElementById('cookie-banner').style.display='block'; }
</script>
