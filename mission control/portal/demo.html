<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>9amLeads - Live dashboard demo</title>
<style>body{margin:0;background:#0b0f19;color:#e2e8f0;font-family:Inter,Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh}</style>
</head><body>
<div style="text-align:center">
<div style="font-size:20px;font-weight:900;color:#fff">9am<span style="color:#38bdf8">Leads</span></div>
<div style="margin-top:14px;color:#94a3b8;font-size:14px" id="msg">Loading your demo dashboard&hellip;</div>
</div>
<script>
(async function(){
  try {
    var _prod = new URLSearchParams(window.location.search).get('product') || 'moving';
    var r = await fetch('/api/demo/login?product=' + encodeURIComponent(_prod));
    var d = await r.json();
    if (!d || !d.token) throw new Error('no token');
    var prod = d.product || _prod;
    var sess = { token: d.token, clientId: 'demo', email: d.email || 'demo@9amleads.com', name: 'Demo Account', plan: 'free_trial', product: prod, products: [prod], demo: true };
    localStorage.setItem('mld_portal_session', JSON.stringify(sess));
    window.location.href = '/portal/dashboard.html';
  } catch(e) {
    document.getElementById('msg').innerHTML = 'Demo temporarily unavailable. <a href="/portal/" style="color:#38bdf8">Go to sign in</a>';
  }
})();
</script>
</body></html>
