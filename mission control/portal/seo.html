<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SEO & Blog | 9amLeads Admin</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#f1f5f9;min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:24px}
h1{font-size:24px;font-weight:800;font-family:'Outfit',sans-serif}
h1 span{color:#0ea5e9}
.sub{color:#8890a8;font-size:13px;margin-bottom:20px}
.card{background:#11131f;border:1px solid #1e2030;border-radius:14px;padding:20px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.2s;font-family:inherit;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff}
.btn-view{background:rgba(14,165,233,0.1);color:#0ea5e9;border:1px solid rgba(14,165,233,0.2)}
.btn-view:hover{background:rgba(14,165,233,0.2)}
.btn-outline{background:transparent;border:1px solid #1e2030;color:#8890a8}
.btn-outline:hover{border-color:#2a2d42;color:#c8cbd6}
.btn-sm{padding:5px 10px;font-size:11px}
.login-box{max-width:400px;margin:80px auto;background:#11131f;border:1px solid #1e2030;border-radius:16px;padding:32px;text-align:center}
.login-box input{width:100%;padding:12px;background:#0f111a;border:1px solid #1e2030;border-radius:8px;font-size:14px;color:#f1f5f9;margin:16px 0 12px;outline:none;font-family:inherit}
.login-box input:focus{border-color:#0ea5e9}
.login-box .logo{font-size:24px;font-weight:900;font-family:'Outfit',sans-serif}
.login-box .logo span{color:#0ea5e9}
.error{color:#ef4444;font-size:13px;display:none;margin-bottom:8px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat-card{background:rgba(14,165,233,0.06);border:1px solid rgba(14,165,233,0.12);border-radius:10px;padding:12px;text-align:center}
.stat-card .num{font-size:22px;font-weight:900;font-family:'Outfit',sans-serif;color:#0ea5e9}
.stat-card .label{font-size:10px;color:#5c6480;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.status-banner{border-radius:10px;padding:12px;font-size:12px;margin-bottom:10px}
</style>
</head>
<body>
<div class="container" id="loginPage" style="display:none">
<div class="login-box">
<div class="logo">9am<span>Leads</span> SEO</div>
<p style="color:#8890a8;font-size:13px;margin:8px 0">Enter admin password to continue</p>
<div style="position:relative"><input type="password" id="adminPass" placeholder="Admin password" style="padding-right:34px;box-sizing:border-box" onkeydown="if(event.key==='Enter')adminLogin()"><span onclick="var p=document.getElementById('adminPass');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'\uD83D\uDC41':'Hide'" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:#8890a8;cursor:pointer;user-select:none;font-weight:600">&#128065;</span></div>
<div id="loginError" class="error">Incorrect password</div>
<button class="btn btn-primary" onclick="adminLogin()" style="width:100%;justify-content:center;padding:12px;font-size:14px"><i class="fas fa-lock"></i> Sign In</button>
</div>
</div>

<div class="container" id="seoPage" style="display:none">
<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px">
<div><div style="display:flex;align-items:center;gap:8px"><div style="width:32px;height:32px;background:linear-gradient(135deg,#0ea5e9,#2563eb);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900;font-family:'Outfit',sans-serif"><i class="fas fa-search"></i></div><h1>SEO &amp; <span>Blog</span></h1></div><p class="sub" style="margin-bottom:0">Automated SEO engine. blog posts, sitemap, indexing</p></div>
<div style="display:flex;gap:8px">
<a href="/portal/admin.html" class="btn btn-outline btn-sm"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
<a href="/portal/" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Portal</a>
<button class="btn btn-outline btn-sm" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
</div>
</div>

<div class="card">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
<div style="font-size:14px;font-weight:700"><i class="fas fa-newspaper" style="color:#0ea5e9;margin-right:6px"></i> SEO Blog Engine</div>
<div style="display:flex;gap:8px">
<button class="btn btn-primary btn-sm" onclick="generateBlogPost()"><i class="fas fa-plus"></i> Generate</button>
<button class="btn btn-sm" style="background:rgba(34,197,94,0.1);color:#22c55e;border:1px solid rgba(34,197,94,0.2)" onclick="generateAllPosts()"><i class="fas fa-forward"></i> Generate All</button>
</div>
</div>
<div id="blogStatus" style="font-size:12px;color:#8890a8;margin-bottom:10px">Loading...</div>
<div id="seoStats" class="stat-grid"></div>
<div id="automationBanner"></div>
<div id="backlinkBanner"></div>
</div>

<div class="card">
<div style="font-size:14px;font-weight:700;margin-bottom:10px"><i class="fas fa-list" style="color:#0ea5e9;margin-right:6px"></i> Published Posts</div>
<div id="blogList"></div>
</div>
</div>

<script>
const API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:8012' : '';

function saveAdminAuth() { sessionStorage.setItem('9amAdminAuth', 'true'); }
function getAdminAuth() { return sessionStorage.getItem('9amAdminAuth') === 'true'; }
function getAdminPass() { return sessionStorage.getItem('9amAdminPass') || ''; }
function adminHeaders() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getAdminPass() }; }

async function verifyPass(pass) {
  for (var attempt = 1; attempt <= 3; attempt++) {
    try {
      const r = await fetch(API + '/api/admin/verify', { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + pass } });
      const d = await r.json();
      if (d) return d;
    } catch(e) {}
    if (attempt < 3) await new Promise(function(res) { setTimeout(res, 1500 * attempt); });
  }
  return { valid: false, error: 'server_unreachable' };
}

async function adminLogin() {
  const pass = document.getElementById('adminPass').value;
  document.getElementById('loginError').style.display = 'none';
  if (!pass) { document.getElementById('loginError').style.display = 'block'; return; }
  var btn = document.querySelector('#loginPage .btn');
  if (btn) { btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...'; btn.disabled = true; }
  const d = await verifyPass(pass);
  if (btn) { btn.innerHTML = '<i class="fas fa-lock"></i> Sign In'; btn.disabled = false; }
  if (!d.valid) {
    document.getElementById('loginError').textContent = (d.error === 'server_unreachable') ? 'Cannot reach server. Waking it up. wait 30s and try again.' : 'Incorrect password (server rejected login)';
    document.getElementById('loginError').style.display = 'block';
    return;
  }
  sessionStorage.setItem('9amAdminPass', pass);
  saveAdminAuth();
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('seoPage').style.display = 'block';
  loadSeoData();
}

function adminLogout() {
  sessionStorage.removeItem('9amAdminAuth');
  sessionStorage.removeItem('9amAdminPass');
  document.getElementById('seoPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'block';
}

// Auto-auth: if already logged into admin, enter directly
if (getAdminAuth()) {
  var storedPass = getAdminPass();
  if (storedPass) {
    fetch(API + '/api/admin/verify', { headers: { 'Authorization': 'Bearer ' + storedPass } }).then(function(r) { return r.json(); }).then(function(d) {
      if (d && d.valid) {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('seoPage').style.display = 'block';
        loadSeoData();
      } else {
        sessionStorage.removeItem('9amAdminAuth');
        sessionStorage.removeItem('9amAdminPass');
        document.getElementById('loginPage').style.display = 'block';
      }
    }).catch(function() {
      document.getElementById('loginError').textContent = 'Cannot reach server. Check connection and try again.';
      document.getElementById('loginError').style.display = 'block';
      document.getElementById('loginPage').style.display = 'block';
    });
  } else {
    document.getElementById('loginPage').style.display = 'block';
  }
} else {
  document.getElementById('loginPage').style.display = 'block';
}

async function loadSeoData() {
  try {
    const r = await fetch(API + '/api/admin/seo/report', { headers: adminHeaders() });
    if (!r.ok) return;
    const d = await r.json();
    var html = '';
    html += '<div class="stat-card"><div class="num">' + d.total_posts + '/' + d.templates_total + '</div><div class="label">Posts Generated</div><div style="font-size:11px;color:#22c55e;margin-top:4px">' + d.completeness_pct + '% complete</div></div>';
    html += '<div class="stat-card"><div class="num">' + d.sitemap_urls + '</div><div class="label">Sitemap URLs</div><div style="font-size:11px;color:#5c6480;margin-top:4px">' + d.posts_this_week + ' this week</div></div>';
    html += '<div class="stat-card"><div class="num">' + (d.avg_word_count || 0).toLocaleString() + '</div><div class="label">Avg Word Count</div><div style="font-size:11px;color:#5c6480;margin-top:4px">' + (d.total_words || 0).toLocaleString() + ' total</div></div>';
    html += '<div class="stat-card"><div class="num">' + d.templates_remaining + '</div><div class="label">Templates Left</div><div style="font-size:11px;color:#a855f7;margin-top:4px">Auto-generates daily</div></div>';
    if (d.by_category && d.by_category.length > 0) {
      html += '<div style="grid-column:1/-1;font-size:11px;color:#5c6480;display:flex;gap:8px;flex-wrap:wrap;padding:4px 0">' + d.by_category.map(function(c) { return '<span style="background:rgba(255,255,255,0.04);padding:3px 8px;border-radius:4px;font-size:10px">' + c.label + ': ' + c.count + '</span>'; }).join('') + '</div>';
    }
    document.getElementById('seoStats').innerHTML = html;

    if (d.automation) {
      var lastRun = d.automation.last_run ? new Date(d.automation.last_run).toLocaleString() : 'not yet run';
      document.getElementById('automationBanner').innerHTML = '<div class="status-banner" style="background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.15);color:#86efac">' +
        '<div style="font-weight:700;margin-bottom:4px">\u2699\ufe0f SEO Automation: <span style="color:#22c55e">ACTIVE</span></div>' +
        '<div>' + d.automation.cron + '</div>' +
        '<div style="color:#5c6480;margin-top:3px">Last run: ' + lastRun + ' &middot; ' + d.automation.posts_left_to_auto + ' posts remaining in queue</div></div>';
    }
    if (d.backlinks) {
      document.getElementById('backlinkBanner').innerHTML = '<div class="status-banner" style="background:rgba(245,158,11,0.06);border:1px solid rgba(245,158,11,0.15);color:#fcd34d">' +
        '<div style="font-weight:700;margin-bottom:4px">\U0001f517 Backlinks</div>' +
        '<div>' + d.backlinks.internal_links + '</div>' +
        '<div style="color:#a16207;margin-top:3px">' + d.backlinks.suggestion + '</div></div>';
    }
    loadBlogPosts();
  } catch(e) {}
}

async function loadBlogPosts() {
  try {
    var r = await fetch(API + '/api/admin/blog/posts', { headers: adminHeaders() });
    var d = await r.json();
    document.getElementById('blogStatus').textContent = d.templates_used + '/' + d.templates_total + ' templates used';
    var container = document.getElementById('blogList');
    if (!d.posts || d.posts.length === 0) {
      container.innerHTML = '<div style="font-size:12px;color:#5c6480;padding:8px 0">No blog posts yet. Click "Generate Post" to create your first SEO-optimised article.</div>';
      return;
    }
    container.innerHTML = d.posts.map(function(p) {
      var dateStr = p.created_at ? new Date(p.created_at).toLocaleDateString() : '';
      return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a1a;font-size:12px">' +
        '<div style="flex:1;min-width:0"><strong>' + p.title + '</strong><br><span style="color:#5c6480">' + p.product_name + ' \u00b7 ' + dateStr + (p.auto_generated ? ' \u00b7 <span style="color:#22c55e">auto</span>' : '') + '</span></div>' +
        '<div style="display:flex;gap:6px;flex-shrink:0">' +
        '<a href="/blog/' + p.slug + '" target="_blank" class="btn btn-view btn-sm" style="padding:3px 8px;font-size:10px"><i class="fas fa-eye"></i></a>' +
        '<button class="btn btn-sm" style="background:rgba(239,68,68,0.1);color:#ef4444;border:1px solid rgba(239,68,68,0.2);padding:3px 8px;font-size:10px" onclick="deleteBlogPost(\'' + p.slug + '\')"><i class="fas fa-trash"></i></button>' +
        '</div></div>';
    }).join('');
  } catch(e) { document.getElementById('blogStatus').textContent = 'Error loading posts'; }
}

async function generateBlogPost() {
  var btn = document.querySelector('#seoPage .btn-primary');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
  try {
    var r = await fetch(API + '/api/admin/blog/generate', { method: 'POST', headers: adminHeaders() });
    var d = await r.json();
    alert('Generated ' + d.count + ' post' + (d.count !== 1 ? 's' : '') + '!');
    loadSeoData();
  } catch(e) { alert('Error: ' + e.message); }
  btn.disabled = false; btn.innerHTML = '<i class="fas fa-plus"></i> Generate';
}

async function generateAllPosts() {
  if (!confirm('Generate ALL remaining blog templates now? This creates all remaining posts.')) return;
  var btn = document.querySelector('#seoPage .btn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating all...';
  try {
    var r = await fetch(API + '/api/admin/blog/generate-all', { method: 'POST', headers: adminHeaders() });
    var d = await r.json();
    alert('Generated ' + d.count + ' posts!');
    loadSeoData();
  } catch(e) { alert('Error: ' + e.message); }
  btn.disabled = false; btn.innerHTML = '<i class="fas fa-forward"></i> Generate All';
}

async function deleteBlogPost(slug) {
  if (!confirm('Delete "' + slug + '"?')) return;
  try {
    await fetch(API + '/api/admin/blog/delete', { method: 'POST', headers: adminHeaders(), body: JSON.stringify({ slug: slug }) });
    loadSeoData();
  } catch(e) { alert('Error: ' + e.message); }
}
</script>
</body>
</html>
