<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>9amLeads Partner Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕘</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--accent:#0ea5e9;--bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--ff-h:'Outfit',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased}
.container{max-width:1040px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
h1,h2,h3{font-family:var(--ff-h)}
.grid{display:grid;gap:10px}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.stat{border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;background:#fff}
.stat .n{font-size:24px;font-weight:900;font-family:var(--ff-h);color:#0c4a6e}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px}
.sect-title{font-size:15px;font-weight:800;font-family:var(--ff-h);margin-bottom:10px;color:#0c4a6e}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:7px 6px;border-bottom:2px solid var(--border);color:var(--muted);font-weight:700}
td{padding:7px 6px;border-bottom:1px solid #f1f5f9;color:#334155}
.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 16px;border-radius:9px;border:none;cursor:pointer;font-weight:700;font-size:12px;font-family:inherit;text-decoration:none}
.btn-p{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff}
.btn-o{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn-s{background:#22c55e;color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.inp{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;margin-bottom:8px}
select.inp{padding:9px 8px}
label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:3px}
.muted{color:var(--muted);font-size:11px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.t-green{background:#dcfce7;color:#166534}.t-amber{background:#fef3c7;color:#92400e}.t-red{background:#fee2e2;color:#991b1b}.t-blue{background:#dbeafe;color:#1e40af}.t-gray{background:#f1f5f9;color:#475569}
.nav{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);z-index:10;padding:10px 0}
.nav-in{display:flex;align-items:center;justify-content:space-between;max-width:1040px;margin:0 auto;padding:0 16px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;background:#eff6ff;color:#0369a1;font-size:10px;font-weight:800;margin-left:6px;text-transform:uppercase}
.hidden{display:none}
.tab-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab-btn{padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.tab-btn.active{background:#0ea5e9;color:#fff;border-color:#0ea5e9}
.copy-btn{cursor:pointer;color:#0369a1;font-size:11px;font-weight:700;background:none;border:none;font-family:inherit}
.link-box{background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:12px;word-break:break-all;color:#0369a1}
.fb-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12px}
.pr-row{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid #f1f5f9;font-size:12px;flex-wrap:wrap}
.follow-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;font-size:12px;flex-wrap:wrap}
.alert{background:#fef3c7;border:1px solid #fde68a;border-radius:10px;padding:10px 14px;font-size:11px;color:#92400e;margin-bottom:12px;line-height:1.6}
.banner{background:linear-gradient(135deg,#eff6ff,#f0f9ff);border:1px solid #bfdbfe;border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:12px;color:#1e3a5f;line-height:1.7}
@media(max-width:640px){
  .grid-3{grid-template-columns:repeat(2,1fr)}
  table{display:block;overflow-x:auto;white-space:nowrap}
  .nav-in{padding:0 12px}
  .stat .n{font-size:20px}
  .btn{padding:8px 12px;font-size:11px}
  .tab-btn{padding:7px 10px;font-size:11px}
  .pnl{display:none}
}
</style>
</head><body>

<div class="nav"><div class="nav-in">
<div style="font-size:18px;font-weight:900;font-family:var(--ff-h)">9am<span style="color:var(--accent)">Leads</span> <span class="badge">Partner</span></div>
<div style="display:flex;align-items:center;gap:14px">
<a href="/portal/partner-help.html" class="pnl" style="color:var(--muted);text-decoration:none;font-size:12px;font-weight:700">Help</a>
<a href="/portal/partner-contact.html" class="pnl" style="color:var(--muted);text-decoration:none;font-size:12px;font-weight:700">Contact</a>
<div style="display:flex;align-items:center;gap:10px" id="nav-right"></div>
</div>
</div></div>

<div class="container">

<!-- LOGIN -->
<div id="login-view" style="max-width:420px;margin:40px auto">
<div class="card" style="text-align:center">
<h1 style="font-size:22px;margin-bottom:4px">Partner Login</h1>
<p class="muted" style="margin-bottom:16px">Affiliates and Sales Partners log in here.</p>
<input class="inp" id="p-email" type="email" placeholder="Email">
<input class="inp" id="p-pass" type="password" placeholder="Password">
<button class="btn btn-p" style="width:100%;justify-content:center" onclick="partnerLogin()">Log In</button>
<div id="p-login-msg" style="margin-top:10px;font-size:12px;color:#dc2626"></div>
<p class="muted" style="margin-top:14px">Not a partner? <a href="/portal/partner-join.html" style="color:#0369a1;font-weight:700">Apply to join →</a></p>
</div>
</div>

<!-- DASHBOARD -->
<div id="dash-view" class="hidden">
<div id="dash-body"></div>
</div>

<div style="text-align:center;color:var(--muted);font-size:12px;padding:6px 16px 30px;line-height:2">
  <a href="/portal/partner-help.html" style="color:#0369a1;text-decoration:none">Help Centre</a> &middot;
  <a href="/portal/partner-contact.html" style="color:#0369a1;text-decoration:none">Contact</a> &middot;
  <a href="/portal/partner-terms.html" style="color:#0369a1;text-decoration:none">Partner Terms</a> &middot;
  <a href="/portal/partner-privacy.html" style="color:#0369a1;text-decoration:none">Privacy</a>
</div>

</div>

<script>
var API = 'https://nineamleads-backend.onrender.com';
function getToken(){ try { return localStorage.getItem('partner_token') || ''; } catch(e){ return ''; } }
function setToken(t){ try { localStorage.setItem('partner_token', t); } catch(e){} }
function logout(){ try { localStorage.removeItem('partner_token'); } catch(e){} window.location.reload(); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return '£' + (Number(n) || 0).toFixed(2); }
function statusTag(st){ var m = { pending:'t-amber', approved:'t-blue', paid:'t-green', held:'t-gray', voided:'t-red', draft:'t-gray', active:'t-green', new:'t-blue', contacted:'t-amber', interested:'t-blue', follow_up:'t-amber', trial_started:'t-blue', paid2:'t-green', lost:'t-red', do_not_contact:'t-gray' }; return '<span class="tag ' + (m[st] || 't-gray') + '">' + esc(st) + '</span>'; }
function copyText(txt, btn){
  try { navigator.clipboard.writeText(txt); } catch(e) { var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  if (btn) { var o = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(function(){ btn.textContent = o; }, 1500); }
}
function hdr(){ return { 'Content-Type':'application/json', 'Authorization': 'Bearer ' + getToken() }; }
function api(method, path, body, cb){
  var x = new XMLHttpRequest(); x.open(method, API + path, true);
  x.setRequestHeader('Authorization', 'Bearer ' + getToken());
  if (body) x.setRequestHeader('Content-Type', 'application/json');
  x.onload = function(){ var d = null; try { d = JSON.parse(x.responseText); } catch(e) {} cb(d, x.status); };
  x.onerror = function(){ cb(null, 0); };
  x.send(body ? JSON.stringify(body) : null);
}
function partnerLogin(){
  var email = document.getElementById('p-email').value.trim();
  var pass = document.getElementById('p-pass').value;
  var msg = document.getElementById('p-login-msg');
  api('POST', '/api/partner/login', { email: email, password: pass }, function(d, st){
    if (d && d.token) { setToken(d.token); loadDash(); }
    else { msg.textContent = (d && d.error) || 'Login failed'; }
  });
}
function loadDash(){
  var tv = document.getElementById('login-view'), dv = document.getElementById('dash-view');
  tv.classList.add('hidden'); dv.classList.remove('hidden');
  api('GET', '/api/partner/dashboard', null, function(d, st){
    if (!d || !d.success) { if (st === 401 || st === 403) { logout(); return; } document.getElementById('dash-body').innerHTML = '<div class="card">Could not load dashboard.</div>'; return; }
    render(d.dashboard);
  });
}
function render(db){
  var p = db.partner;
  document.getElementById('nav-right').innerHTML = '<span style="font-size:12px;font-weight:700">' + esc(p.full_name || p.email) + '</span> <span class="tag t-blue">' + esc(({affiliate:'Affiliate',sales_partner:'Sales Partner',association:'Trade Association'}[p.partner_type]) || p.partner_type) + '</span> <button class="btn btn-o btn-ghost" style="font-size:11px" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>';
  var isSales = p.partner_type === 'sales_partner';
  var isAssoc = p.partner_type === 'association';
  var assoc = db.association || {};
  var html = '';
  // Banner
  var trialDays = db.trial_days || 14;
  var _codeBox = '<div style="margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
    '<span style="font-family:var(--ff-h);font-weight:900;font-size:20px;letter-spacing:1px;color:#0c4a6e;background:#fff;border:1px dashed #93c5fd;border-radius:10px;padding:8px 16px">' + esc(db.referral_code || '') + '</span>' +
    '<button class="btn btn-p" onclick="copyText(\'' + esc(db.referral_code || '') + '\', this)">Copy code</button>' +
    '<button class="btn btn-o" onclick="copyText(\'' + esc(db.referral_link || '') + '\', this)">Copy link</button>' +
    '</div>';
  if (isAssoc) {
    html += '<div class="banner"><strong>Your referral code</strong> - share it and your members get an extended ' + trialDays + '-day free trial. ' + (assoc.co_brand ? esc(assoc.co_brand) + '.' : '') + _codeBox + '<div class="link-box" style="margin-top:8px">' + esc(db.referral_link) + '</div></div>';
  } else {
    html += '<div class="banner"><strong>Your referral code</strong> - share it and anyone who signs up gets an extended ' + trialDays + '-day free trial.' + _codeBox + '<div class="link-box" style="margin-top:8px">' + esc(db.referral_link) + '</div></div>';
  }
  // Getting started
  html += '<div class="card"><div class="sect-title">Getting started</div><ol style="margin:0;padding-left:18px;font-size:12.5px;color:#334155;line-height:1.9">' +
    '<li>Share your code or link with your members.</li>' +
    (isAssoc ? '<li>Or use "Invite your members" below and we will send the co-branded invitation for you.</li>' : '<li>Use the ready-made scripts in Resources.</li>') +
    '<li>Your referrals sign up and get <b>' + trialDays + ' days free</b>, no card needed.</li>' +
    '<li>You earn <b>' + fmt(p.commission_amount || 25) + ' per active customer, per month</b>, recurring while they stay.</li>' +
    '</ol></div>';
  // Custom vanity referral code
  html += '<div class="card"><div class="sect-title">Customise your referral code</div>' +
    '<p class="muted" style="margin-bottom:8px">Choose your own memorable code (3-24 letters/numbers). Your link and QR update automatically. New sign-ups still get the full 14-day free trial.</p>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
    '<input class="inp" id="code-input" value="' + esc(db.referral_code || '') + '" style="max-width:220px;text-transform:uppercase" placeholder="YOURCODE">' +
    '<button class="btn btn-p" onclick="saveCode()">Save code</button> <span id="code-msg" class="muted"></span>' +
    '</div></div>';
  // Promotion tips
  html += '<div class="card"><div class="sect-title">How to promote 9amLeads</div><ul style="margin:0;padding-left:18px;font-size:12.5px;color:#334155;line-height:1.9">' +
    '<li><b>Frame it as a member benefit</b> - tell your members that, as part of their membership, they get <b>2 weeks of free 9amLeads</b>: fresh moving leads delivered every morning.</li>' +
    '<li>Email your member list using the ready-made wording in your Share kit (one click to copy).</li>' +
    '<li>Add it to your newsletter or member bulletin.</li>' +
    '<li>Post it in your member forum, WhatsApp or Slack group.</li>' +
    '<li>Include it in your new-member welcome pack.</li>' +
    '<li>Share your link on LinkedIn/Facebook and on your website\'s partners page.</li>' +
    '<li>Print your QR code (Share kit) for events, AGMs and trade shows.</li>' +
    '<li>Ask members to quote your code when they sign up.</li>' +
    '</ul></div>';
  // Help members succeed
  html += '<div class="card"><div class="sect-title">Help your members get the most from it</div><ul style="margin:0;padding-left:18px;font-size:12.5px;color:#334155;line-height:1.9">' +
    '<li>Tell them to <b>upload a flyer and letter in Print &amp; Post</b> (or email it to hello@9amleads.com and we upload it).</li>' +
    '<li>Turn on <b>Auto Print &amp; Post</b> so every new lead is printed and posted automatically each morning.</li>' +
    '<li>Post consistently for <b>2-4 weeks</b> - direct mail builds, it is not overnight.</li>' +
    '<li>Use <b>Bulk Postage</b> in quiet weeks to keep the pipeline full.</li>' +
    '<li>Connect their <b>CRM</b> so leads land in their system automatically at 9am.</li>' +
    '</ul></div>';
  // Partner FAQs
  var _faqs = [
    ['How much do I earn, and when am I paid?', 'You earn £25 per active paying customer, per month, recurring for as long as they stay - that is £2,500/month for every 100 active customers. Commission is approved after our standard ~30-day clearance period and paid weekly by UK bank transfer, once your payout details are verified. No minimum.'],
    ['What trial do my members get?', 'Through your link or code they get an extended 14-day (2-week) free trial - double our standard 7 days. No card is required to start.'],
    ['How is a member credited to me?', 'They must sign up through your link or quote your code. Attribution lasts 30 days from the first click, so you still get the credit if they sign up later.'],
    ['How will I know when someone signs up with my code?', 'You are alerted two ways: an email and a notification in your dashboard the moment someone starts a free trial with your code or link. You get another alert when they become a paying customer, and if a payment ever fails or they cancel.'],
    ['When does my commission start?', 'When a referred member becomes a paying customer. It then recurs monthly while they remain subscribed. If they cancel, commission for that customer stops.'],
    ['Can I choose my own code?', 'Yes - use "Customise your referral code" above. Your link and QR update automatically.'],
    ['Do I have to manage anything?', 'No. We handle onboarding, support, billing and the daily delivery. You just share your link/code, or use "Invite your members" and we send the co-branded invitation for you.'],
    ['Is there a co-branded page?', 'Yes - your link opens a page that says "In partnership with" your organisation, with the 14-day free trial offer.'],
    ['How do I track results?', 'Your growth funnel above shows clicks, invites, joins, trials, paying customers and churn.'],
    ['What can my members do with it?', 'Fresh leads at 9am, Print & Post with postage tracking, Auto Print & Post, Bulk Postage for quiet times, and CRM integration.'],
    ['Does it cost me anything?', 'No cost, no minimum and no lock-in. You only earn when your members pay us.'],
    ['Can I pause or leave?', 'Yes - reply to hello@9amleads.com and we will pause or close your account. Commission already earned is still paid.'],
    ['Who do I contact?', 'Email hello@9amleads.com - we usually reply the same working day.']
  ];
  html += '<div class="card"><div class="sect-title">Partner FAQs</div>' +
    _faqs.map(function(f){ return '<details style="border-bottom:1px solid var(--border);padding:8px 0"><summary style="cursor:pointer;font-weight:700;font-size:13px;color:#0c4a6e">' + esc(f[0]) + '</summary><p class="muted" style="margin:8px 0 0;font-size:12.5px;line-height:1.7">' + esc(f[1]) + '</p></details>'; }).join('') +
    '</div>';
  // Ask a question + contact
  html += '<div class="card"><div class="sect-title">Ask us a question</div>' +
    '<p class="muted" style="margin-bottom:8px">Questions about commission, your members or anything else? Send it here and we will reply by email.</p>' +
    '<textarea class="inp" id="ask-q" rows="3" placeholder="Type your question..."></textarea>' +
    '<button class="btn btn-p" onclick="askQuestion()">Send question</button> <span id="ask-msg" class="muted" style="margin-left:8px"></span>' +
    '</div>';
  html += '<div class="card"><div class="sect-title">Contact</div>' +
    '<p style="font-size:13px;color:#334155;line-height:1.8">Ketz Mandalia, Founder<br><a href="mailto:hello@9amleads.com" style="color:var(--accent);font-weight:700">hello@9amleads.com</a></p>' +
    '<p class="muted" style="margin-top:6px">We usually reply the same working day.</p>' +
    '</div>';
  // Payout details (KYC + bank) - required before commission can be paid out.
  html += '<div class="card"><div class="sect-title">Payout details</div>' +
    '<div id="kyc-status" class="muted" style="margin-bottom:10px">Checking...</div>' +
    '<div id="kyc-form">' +
    '<p class="muted" style="margin-bottom:8px">We pay commission by UK bank transfer. Add your details so your first payout is not held. Your legal name must match the bank account holder.</p>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">' +
    '<div><label style="font-size:11px;font-weight:700;color:#334155">Legal name</label><input class="inp" id="k-legal" placeholder="As shown on your ID"></div>' +
    '<div><label style="font-size:11px;font-weight:700;color:#334155">ID type</label><select class="inp" id="k-idtype"><option>Driving licence</option><option>Passport</option></select></div>' +
    '<div><label style="font-size:11px;font-weight:700;color:#334155">Bank name</label><input class="inp" id="k-bank" placeholder="e.g. Barclays"></div>' +
    '<div><label style="font-size:11px;font-weight:700;color:#334155">Account holder</label><input class="inp" id="k-holder" placeholder="Name on the account"></div>' +
    '<div><label style="font-size:11px;font-weight:700;color:#334155">Sort code</label><input class="inp" id="k-sort" placeholder="20-00-00"></div>' +
    '<div><label style="font-size:11px;font-weight:700;color:#334155">Account number</label><input class="inp" id="k-acct" placeholder="8 digits"></div>' +
    '</div>' +
    '<label style="display:block;font-size:11px;font-weight:700;color:#334155;margin-top:10px">Photo/scan of your ID</label><input type="file" id="k-idfile" accept="image/*" style="font-size:12px;margin-top:4px">' +
    '<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:#334155"><input type="checkbox" id="k-tc" style="width:auto"> I accept the partner agreement</label>' +
    '<button class="btn btn-p" onclick="submitKyc()">Submit payout details</button> <span id="kyc-msg" class="muted" style="margin-left:8px"></span>' +
    '</div></div>';
  // Payouts + VAT invoices
  html += '<div class="card"><div class="sect-title">Payouts &amp; VAT invoices</div><div id="payouts-list" class="muted">Loading...</div></div>';
  // Member invite tool (associations)
  if (isAssoc) {
    html += '<div class="card"><div class="sect-title">Invite your members</div>' +
      '<p class="muted" style="margin-bottom:8px">Paste member emails (one per line), or "Name &lt;email&gt;", or upload a CSV. We send a co-branded invitation carrying your code; every sign-up is credited to you. Up to 200 at a time.</p>' +
      '<textarea class="inp" id="inv-emails" rows="4" placeholder="Jane Smith &lt;jane@example.com&gt;&#10;member2@example.com"></textarea>' +
      '<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:8px">' +
      '<label class="muted" style="margin:0">CSV/TXT: <input type="file" id="inv-csv" accept=".csv,.txt" onchange="readInviteCsv(this)" style="font-size:11px"></label>' +
      '<label class="muted" style="margin:0">Schedule (optional): <input class="inp" id="inv-when" type="datetime-local" style="width:auto;display:inline-block;margin:0;padding:6px 8px"></label>' +
      '</div>' +
      '<button class="btn btn-p" onclick="sendInvites()">Send invitations</button> <span id="inv-msg" class="muted" style="margin-left:8px"></span>' +
      '<div style="margin-top:8px"><input class="inp" id="inv-filter" placeholder="Filter history by segment (optional)" oninput="loadInvites(this.value)" style="max-width:280px"></div>' +
      '<div id="inv-history" style="margin-top:10px"></div>' +
      '</div>';
    html += '<div id="growth"></div>';
    html += '<div class="card"><div class="sect-title">Share kit</div>' +
      '<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">' +
      '<img alt="QR code" width="120" height="120" style="border:1px solid var(--border);border-radius:8px" src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(db.referral_link) + '">' +
      '<div style="flex:1;min-width:220px"><p class="muted" style="margin-bottom:6px">Print this QR code for events/newsletters, or copy ready-made wording:</p>' +

function submitKyc(){
  var msg = document.getElementById('kyc-msg');
  function post(idB64){
    var body = {
      legal_name: document.getElementById('k-legal').value,
      id_type: document.getElementById('k-idtype').value,
      bank_name: document.getElementById('k-bank').value,
      bank_account_holder: document.getElementById('k-holder').value,
      bank_sort_code: document.getElementById('k-sort').value,
      bank_account_number: document.getElementById('k-acct').value,
      id_image: idB64,
      accept_tc: document.getElementById('k-tc').checked
    };
    msg.textContent = 'Submitting...';
    api('POST', '/api/affiliate/kyc', body, function(d, st){
      if (d && d.success) { msg.textContent = 'Submitted - we will review your ID shortly.'; loadKyc(); }
      else { msg.textContent = (d && d.error) || 'Could not submit - please check the fields.'; }
    });
  }
  var f = document.getElementById('k-idfile').files[0];
  if (!f) { msg.textContent = 'Please attach a photo/scan of your ID.'; return; }
  var r = new FileReader();
  r.onload = function(){ post(String(r.result || '')); };
  r.readAsDataURL(f);
}

  fetch(API + '/api/partner/payouts/' + id + '/invoice.pdf', { headers: { 'Authorization': 'Bearer ' + getToken() } })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
    .then(function(blob){ var url = URL.createObjectURL(blob); var a = document.createElement('a'); a.href = url; a.download = '9amleads-partner-invoice.pdf'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 4000); })
    .catch(function(){ alert('Could not download the invoice.'); });
}
function askQuestion(){
  var el = document.getElementById('ask-q'); var msg = document.getElementById('ask-msg');
  if (!el) return;
  var q = String(el.value || '').trim();
  if (!q) { msg.textContent = 'Please type your question.'; return; }
  msg.textContent = 'Sending...';
  api('POST', '/api/partner/ask', { question: q }, function(d, st){
    if (d && d.success) { msg.textContent = d.message || 'Sent - we will reply by email.'; el.value = ''; }
    else { msg.textContent = (d && d.error) || 'Could not send your question.'; }
  });
}
function saveCode(){
  var el = document.getElementById('code-input'); var msg = document.getElementById('code-msg');
  if (!el) return;
  var code = String(el.value || '').trim().toUpperCase();
  if (!code) { msg.textContent = 'Enter a code.'; return; }
  msg.textContent = 'Saving...';
  api('POST', '/api/partner/set-code', { code: code }, function(d, st){
    if (d && d.success) { msg.textContent = 'Saved - your new code is ' + d.code + '.'; loadDash(); }
    else { msg.textContent = (d && d.error) || 'Could not save that code.'; }
  });
}
function sendInvites(){
  var el = document.getElementById('inv-emails'); var msg = document.getElementById('inv-msg');
  if (!el) return;
  var emails = String(el.value || '').split(/\r?\n|[,;]+/).map(function(s){ return s.trim(); }).filter(Boolean);
  if (!emails.length) { msg.textContent = 'Add at least one email address.'; return; }
  var when = document.getElementById('inv-when');
  var body = { emails: emails };
  if (when && when.value) { body.scheduled_at = new Date(when.value).toISOString(); }
  msg.textContent = 'Sending...';
  api('POST', '/api/partner/invites', body, function(d, st){
    if (d && d.success) {
      var parts = [];
      if (d.sent) parts.push('sent ' + d.sent);
      if (d.scheduled) parts.push('scheduled ' + d.scheduled);
      if (d.skipped) parts.push(d.skipped + ' already invited');
      msg.textContent = parts.length ? parts.join(', ') : 'Nothing to do.';
      el.value = ''; if (when) when.value = ''; loadInvites(); loadGrowth();
    } else { msg.textContent = (d && d.error) || 'Could not send invitations.'; }
  });
}
function readInviteCsv(input){
  var f = input.files && input.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){ var ta = document.getElementById('inv-emails'); if (ta) ta.value = String(r.result || '').trim(); };
  r.readAsText(f);
}
function loadGrowth(){
  api('GET', '/api/partner/funnel', null, function(d){
    var el = document.getElementById('growth'); if (!el || !d || !d.success) return;
    var f = d.funnel || {}, c = d.commission || {}, t = d.tier || {}, b = d.leaderboard || [];
    var step = function(label, val, last){ return '<div style="flex:1;min-width:78px;text-align:center"><div style="font-family:var(--ff-h);font-weight:900;font-size:20px;color:#0c4a6e">' + (val||0) + '</div><div class="muted">' + label + '</div></div>' + (last ? '' : '<div style="align-self:center;color:#cbd5e1">&#8594;</div>'); };
    var h = '<div class="card"><div class="sect-title">Your growth funnel</div>' +
      '<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">' + step('Clicks', f.clicks) + step('Invites', f.invites_sent) + step('Joined', f.invites_converted) + step('Trials', f.trials) + step('Paying', f.paying) + step('Churned', f.churned, true) + '</div>' +
      '<p class="muted" style="margin-top:10px">You earn ' + fmt(c.per_member || 25) + ' per active member, per month - currently ' + fmt(c.monthly_now || 0) + '/month recurring.</p>' +
      (t.next_members ? '<p class="muted">Next milestone: ' + t.next_members + ' active members = ' + fmt(t.next_monthly) + '/month.</p>' : '<p class="muted">Top tier reached - well done.</p>') +
      '</div>';
    if (b.length) { h += '<div class="card"><div class="sect-title">Partner leaderboard</div>' + b.map(function(x, i){ return '<div class="fb-item"><b>#' + (i + 1) + ' ' + esc(x.name) + '</b> <span class="tag t-blue">' + x.paying + ' paying</span></div>'; }).join('') + '</div>'; }
    el.innerHTML = h;
  });
}
function downloadStatement(){
  fetch(API + '/api/partner/statement.pdf?t=' + Date.now(), { headers: { 'Authorization': 'Bearer ' + getToken() } })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
    .then(function(blob){ var url = URL.createObjectURL(blob); var a = document.createElement('a'); a.href = url; a.download = '9amleads-statement.pdf'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 4000); })
    .catch(function(){ alert('Could not download the statement.'); });
}
function loadInvites(segment){
  var seg = segment || (document.getElementById('inv-filter') ? document.getElementById('inv-filter').value : '');
  api('GET', '/api/partner/invites' + (seg ? ('?segment=' + encodeURIComponent(seg)) : ''), null, function(d){
    var el = document.getElementById('inv-history'); if (!el) return;
    var list = (d && d.invites) || [];
    var segs = (d && d.segments) || {};
    var segLine = Object.keys(segs).length ? '<p class="muted" style="margin-bottom:6px">Segments: ' + Object.keys(segs).map(function(k){ return esc(k) + ' (' + segs[k] + ')'; }).join(' &middot; ') + '</p>' : '';
    if (!list.length) { el.innerHTML = segLine + '<p class="muted">No invitations' + (seg ? ' in this segment' : ' sent yet') + '.</p>'; return; }
    var joined = list.filter(function(iv){ return iv.converted; }).length;
    el.innerHTML = '<div class="sect-title" style="font-size:12px">Invitation history</div>' +
      '<p class="muted" style="margin-bottom:6px">' + list.length + ' shown &middot; ' + joined + ' joined</p>' + segLine +
      list.map(function(iv){ return '<div class="fb-item"><b>' + esc(iv.name ? (iv.name + ' - ' + iv.email) : iv.email) + '</b> ' + (iv.converted ? '<span class="tag t-green">joined</span>' : (iv.scheduled ? '<span class="tag t-amber">scheduled</span>' : '<span class="tag t-gray">invited</span>')) + (iv.company ? ' <span class="muted">' + esc(iv.company) + '</span>' : '') + (iv.segment ? ' <span class="tag t-blue">' + esc(iv.segment) + '</span>' : '') + ' <span class="muted">' + (iv.sent_at ? ('sent ' + new Date(iv.sent_at).toLocaleDateString()) : (iv.scheduled_at ? ('for ' + new Date(iv.scheduled_at).toLocaleDateString()) : '')) + '</span></div>'; }).join('');
  });
}
function renderResources(){  api('GET', '/api/partner/resources', null, function(d){
    var list = (d && d.resources) || [];
    var html = '<div class="card"><div class="sect-title">Sales Resources</div>';
    if (!list.length) html += '<p class="muted">No resources published yet.</p>';
    else {
      html += '<div class="grid-2" style="display:grid;gap:8px">';
      list.forEach(function(r){ html += '<div class="card" style="margin-bottom:0"><b style="font-size:13px">' + esc(r.title) + '</b><span class="tag t-blue" style="margin-left:6px">' + esc(r.category) + '</span><p class="muted" style="margin-top:4px">' + esc((r.content || '').substring(0, 180)) + '</p>' + (r.url ? '<a href="' + esc(r.url) + '" target="_blank" class="btn btn-o" style="font-size:11px;padding:5px 12px;margin-top:6px">Open</a>' : '') + '</div>'; });
      html += '</div>';
    }
    html += '</div>';
    var el = document.getElementById('tab-resources'); if (el) el.innerHTML = html;
  });
}
function showModal(html){
  var m = document.createElement('div');
  m.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto';
  var c = document.createElement('div'); c.style.cssText = 'max-width:520px;width:100%'; c.innerHTML = html;
  m.appendChild(c); m.addEventListener('click', function(e){ if (e.target === m) m.remove(); });
  document.body.appendChild(m);
  window._modal = m;
}
function closeModal(){ try { if (window._modal) window._modal.remove(); } catch(e) {} }
(function init(){
  if (getToken()) { loadDash(); }
  else { document.getElementById('login-view').classList.remove('hidden'); }
})();
</script>
