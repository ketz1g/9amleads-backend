<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketing Tools · 9amLeads</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--accent:#0ea5e9;--bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--text2:#64748b;--muted:#94a3b8;--success:#22c55e;--ff-h:'Outfit',sans-serif;--ff-b:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--ff-b);color:var(--text);background:#fff;min-height:100vh;line-height:1.5}
.top{background:#fff;border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.top .logo{font-family:var(--ff-h);font-size:20px;font-weight:900;color:var(--text)}.top .logo span{color:var(--accent)}
.top .nav{display:flex;gap:4px}.top .nav a{padding:8px 16px;font-size:13px;font-weight:500;color:var(--text2);text-decoration:none;border-radius:6px;transition:.2s}.top .nav a:hover{color:var(--text);background:#f1f5f9}.top .nav a.active{color:var(--accent);background:#eff6ff}
.container{max-width:1100px;margin:0 auto;padding:28px 24px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-header h1{font-family:var(--ff-h);font-size:22px;font-weight:800}
.sub{font-size:13px;color:var(--text2);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;text-decoration:none;font-family:var(--ff-b);transition:.2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-outline{background:#fff;color:var(--text2);border:1px solid var(--border)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.sect-title{font-family:var(--ff-h);font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.label{font-size:11px;font-weight:600;color:var(--text2);display:block;margin-bottom:4px}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:var(--ff-b);outline:none;transition:.2s;background:#fff}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,165,233,.08)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.result-box{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:14px;white-space:pre-wrap;font-size:13px;line-height:1.7;max-height:400px;overflow-y:auto}
.result-box pre{white-space:pre-wrap;font-family:var(--ff-b)}
.generated-item{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.generated-item h4{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--accent)}
.tone-pill{display:inline-block;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;margin:0 4px 4px 0;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text2)}
.tone-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;z-index:999;display:none;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.empty{text-align:center;padding:30px 20px;color:var(--text2)}.empty i{font-size:30px;color:var(--border);display:block;margin-bottom:8px}
@media(max-width:768px){.grid-2,.grid-3{grid-template-columns:1fr}.container{padding:20px 16px}.top{flex-wrap:wrap}.top .nav{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 4px;max-width:100%;flex-wrap:nowrap}.top .nav a{padding:7px 11px;font-size:12px;white-space:nowrap;flex-shrink:0}}
</style></head><body>
<div class="top">
<div class="logo">9am<span>Leads</span></div>
<div class="nav"><a href="/portal/dashboard.html">Dashboard</a><a href="/portal/leads.html">My Leads</a><a href="/portal/direct-mail.html">Print &amp; Post</a><a href="#" class="active">Marketing Tools</a><a href="/portal/" onclick="doLogout();return false" style="color:#dc2626;font-weight:700"><i class="fas fa-sign-out-alt"></i> Logout</a></div>
</div>
<div class="container">
<div class="page-header">
<div><h1><i class="fas fa-pen-fancy" style="color:var(--accent);margin-right:6px"></i> Marketing Tools</h1><div class="sub">Create professional letters and flyers. print them or send via Print &amp; Post</div></div>
</div>
<div id="toast"></div>

<!-- Business Profile -->
<div class="card">
<div class="sect-title"><i class="fas fa-building" style="color:var(--accent)"></i> Your Business Profile</div>
<p style="font-size:12px;color:var(--text2);margin-bottom:12px">We use these details for your letters and flyers.</p>
<div class="grid-2">
<div><label class="label">Company Name *</label><input class="input" id="p-company_name" placeholder="e.g. Acme Removals Ltd"></div>
<div><label class="label">Business Type *</label><input class="input" id="p-business_type" placeholder="e.g. Removal Company"></div>
<div><label class="label">Services Offered</label><input class="input" id="p-services" placeholder="e.g. House removals, packing, storage"></div>
<div><label class="label">Service Areas</label><input class="input" id="p-areas" placeholder="e.g. North West London, Hertfordshire"></div>
<div><label class="label">Special Offer</label><input class="input" id="p-offer" placeholder="e.g. 10% off first move"></div>
<div><label class="label">Phone *</label><input class="input" id="p-phone" placeholder="Phone number"></div>
<div><label class="label">Email *</label><input class="input" id="p-email" placeholder="you@company.com"></div>
<div><label class="label">Website</label><input class="input" id="p-website" placeholder="www.yourcompany.com"></div>
<div><label class="label">Call To Action</label><input class="input" id="p-cta" placeholder="Get in touch today"></div>
</div>
<button class="btn btn-primary" onclick="saveProfile()" style="margin-top:12px"><i class="fas fa-save"></i> Save Profile</button>
</div>

<!-- Saved Templates -->
<div class="card">
<div class="sect-title"><i class="fas fa-bookmark" style="color:var(--accent)"></i> Saved Templates</div>
<div class="grid-2">
<div><label class="label">Save Current Content As</label><input class="input" id="tpl-name" placeholder="e.g. My Intro Letter"></div>
<div><label class="label">Type</label><select class="input" id="tpl-type"><option value="letter">Letter</option><option value="flyer">Flyer</option><option value="postcard">Postcard</option></select></div>
</div>
<div style="margin-top:10px"><label class="label">Content</label><textarea class="input" id="tpl-content" rows="5" placeholder="Paste the generated letter or flyer content here, or write your own..."></textarea></div>
<button class="btn btn-outline" onclick="saveTemplate()" style="margin-top:10px"><i class="fas fa-save"></i> Save Template</button>
<div id="templates-list" style="margin-top:14px"></div>
</div>
</div>

<script>
var _token='';
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},3000);}
function api(method,path,body,cb){var x=new XMLHttpRequest();x.open(method,path,true);x.setRequestHeader('Authorization','Bearer '+_token);if(body)x.setRequestHeader('Content-Type','application/json');x.onload=function(){try{cb(null,JSON.parse(x.responseText));}catch(e){cb(null,x.responseText);}};x.onerror=function(){cb('network');};x.send(body?JSON.stringify(body):null);}
function doLogout(){if(confirm('Log out?')){localStorage.removeItem('mld_portal_session');window.location.href='/portal/';}}

function saveProfile(){
  var body={
    company_name:document.getElementById('p-company_name').value,
    business_type:document.getElementById('p-business_type').value,
    services_offered:document.getElementById('p-services').value,
    service_areas:document.getElementById('p-areas').value,
    special_offer:document.getElementById('p-offer').value,
    phone:document.getElementById('p-phone').value,
    email:document.getElementById('p-email').value,
    website:document.getElementById('p-website').value,
    call_to_action:document.getElementById('p-cta').value,
    brand_tone:tones.letter
  };
  if(!body.company_name||!body.business_type){toast('Company name and business type required');return;}
  api('POST','/api/direct-mail/profile',body,function(err,d){toast(d&&d.success?'Profile saved':'Error: '+((d&&d.error)||'check fields'));});
}
function loadProfile(){
  api('GET','/api/direct-mail/profile',null,function(err,d){
    if(d&&d.profile){
      var p=d.profile;
      document.getElementById('p-company_name').value=p.company_name||'';
      document.getElementById('p-business_type').value=p.business_type||'';
      document.getElementById('p-services').value=p.services_offered||'';
      document.getElementById('p-areas').value=p.service_areas||'';
      document.getElementById('p-offer').value=p.special_offer||'';
      document.getElementById('p-phone').value=p.phone||'';
      document.getElementById('p-email').value=p.email||'';
      document.getElementById('p-website').value=p.website||'';
      document.getElementById('p-cta').value=p.call_to_action||'';
    }
  });
}

function getBizData(){
  return {
    company_name:document.getElementById('p-company_name').value||'Your Company',
    business_type:document.getElementById('p-business_type').value||'Business',
    services:document.getElementById('p-services').value,
    service_area:document.getElementById('p-areas').value,
    special_offer:document.getElementById('p-offer').value,
    phone:document.getElementById('p-phone').value,
    email:document.getElementById('p-email').value,
    website:document.getElementById('p-website').value,
    call_to_action:document.getElementById('p-cta').value||'Get in touch today',
    tone:tones.letter
  };
}

function saveTemplate(){
  var body={name:document.getElementById('tpl-name').value,type:document.getElementById('tpl-type').value,ai_generated_text:document.getElementById('tpl-content').value};
  if(!body.name){toast('Template name required');return;}
  api('POST','/api/direct-mail/templates',body,function(err,d){toast(d&&d.success?'Template saved':'Template error');if(d&&d.success)loadTemplates();});
}
function loadTemplates(){
  api('GET','/api/direct-mail/templates',null,function(err,d){
    var tpls=(d&&d.templates)||[];
    var list=document.getElementById('templates-list');
    var html='';
    tpls.forEach(function(t){
      html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px"><div><div style="font-weight:600;font-size:13px">'+t.name+'</div><div style="font-size:11px;color:var(--text2)">'+t.template_type+'</div></div><span style="padding:3px 10px;border-radius:5px;font-size:10px;font-weight:700;background:rgba(34,197,94,.08);color:var(--success)">Saved</span></div>';
    });
    list.innerHTML=html||'<div class="empty"><i class="fas fa-bookmark"></i>No templates yet</div>';
  });
}

(function(){
  var sd=localStorage.getItem('mld_portal_session');
  if(!sd){window.location.href='/portal/';return;}
  var sess=JSON.parse(sd);_token=sess.token;
  if(!_token){window.location.href='/portal/';return;}
  // Brand tone for the letter + flyer templates (used when saving the business profile).
  var tones = { letter: 'professional', flyer: 'professional' };
  function setTone(type, tone) { if (tones && type) tones[type] = tone || 'professional'; }
  loadProfile();
  loadTemplates();
  setTone('letter','professional');
  setTone('flyer','professional');
})();
</script>
</body></html>
