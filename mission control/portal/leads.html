<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Leads · 9amLeads</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--accent:#0ea5e9;--bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#1e293b;--text2:#64748b;--muted:#94a3b8;--success:#22c55e;--ff-h:'Outfit',sans-serif;--ff-b:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--ff-b);color:var(--text);background:#fff;min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
.top{background:#fff;border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.top .logo{font-family:var(--ff-h);font-size:20px;font-weight:900;color:var(--text)}.top .logo span{color:var(--accent)}
.top .nav{display:flex;gap:4px}.top .nav a{padding:8px 16px;font-size:13px;font-weight:500;color:var(--text2);text-decoration:none;border-radius:6px;transition:.2s}.top .nav a:hover{color:var(--text);background:#f1f5f9}.top .nav a.active{color:var(--accent);background:#eff6ff}
.container{max-width:1100px;margin:0 auto;padding:28px 24px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-header h1{font-family:var(--ff-h);font-size:22px;font-weight:800}
.page-header .sub{font-size:13px;color:var(--text2);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;text-decoration:none;font-family:var(--ff-b);transition:.2s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-outline{background:#fff;color:var(--text2);border:1px solid var(--border)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 14px;text-align:center}
.stat .num{font-family:var(--ff-h);font-size:26px;font-weight:900;color:var(--accent)}
.stat .lbl{font-size:11px;color:var(--text2);margin-top:2px}
.search-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:var(--ff-b);outline:none;transition:.2s}
.search-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,165,233,.08)}
.search-bar select{padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:var(--ff-b);background:#fff;outline:none;cursor:pointer}
.lead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;transition:.15s}
.lead:hover{border-color:var(--accent);background:#fafbff}
.lead .addr{font-weight:600;font-size:13px;color:var(--text)}
.lead .meta{font-size:11px;color:var(--text2);margin-top:2px}
.lead .price{font-weight:700;font-size:14px;color:var(--text)}
.lead .right{text-align:right}
.badge{padding:3px 10px;border-radius:5px;font-size:9px;font-weight:700;background:rgba(34,197,94,.08);color:var(--success);white-space:nowrap}
.badge-sstc{background:rgba(245,158,11,.08);color:#d97706}
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty i{font-size:40px;color:var(--border);display:block;margin-bottom:10px}
.loading{text-align:center;padding:60px;color:var(--text2);font-size:13px}
footer{text-align:center;padding:24px 0 0;border-top:1px solid var(--border);margin-top:28px;font-size:12px;color:var(--muted)}
footer a{color:var(--accent);text-decoration:underline}
@media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}.container{padding:20px 16px}.page-header{flex-direction:column;align-items:stretch;text-align:center}}
</style></head><body>
<div class="top">
<div class="logo">9am<span>Leads</span></div>
<div class="nav"><a href="/portal/dashboard.html">Dashboard</a><a href="#" class="active">My Leads</a><a href="/portal/">Account</a><a href="#" onclick="doLogout();return false" style="color:#dc2626;font-weight:700"><i class="fas fa-sign-out-alt"></i> Logout</a></div>
</div>
<div class="container">
<div class="page-header">
<div><h1><i class="fas fa-list" style="color:var(--accent);margin-right:6px"></i> My Leads</h1><div class="sub" id="date-label">All time</div></div>
<div style="display:flex;gap:8px">
<a href="/portal/dashboard.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Dashboard</a>
<button class="btn btn-primary" onclick="exportLeads()"><i class="fas fa-download"></i> Export</button>
</div>
</div>

<div class="stats">
<div class="stat"><div class="num" id="stat-today">0</div><div class="lbl">Today</div></div>
<div class="stat"><div class="num" id="stat-week">0</div><div class="lbl">This Week</div></div>
<div class="stat"><div class="num" id="stat-month">0</div><div class="lbl">This Month</div></div>
<div class="stat"><div class="num" id="stat-total">0</div><div class="lbl">All Time</div></div>
</div>

<div class="search-bar">
<input type="text" id="search-input" placeholder="Search by address, postcode or area..." onkeyup="filterLeads()">
<select id="status-filter" onchange="filterLeads()">
<option value="">All statuses</option><option value="SSTC">SSTC</option><option value="New">New</option><option value="Reduced">Reduced</option><option value="Available">Available</option>
</select>
<select id="date-filter" onchange="filterLeads()">
<option value="all">All time</option><option value="today">Today</option><option value="week">This week</option><option value="month">This month</option>
</select>
</div>

<div class="loading" id="leads-loading"><i class="fas fa-spinner fa-spin"></i>&nbsp; Loading your leads...</div>
<div id="leads-container"></div>
<div class="empty" id="no-leads" style="display:none"><i class="fas fa-inbox"></i><h3 style="font-size:16px;font-weight:700;margin-bottom:4px">No leads yet</h3><p style="font-size:13px">Your first leads will arrive at 9am tomorrow.</p></div>
</div>

<footer><p>&copy; 2026 9amLeads &middot; <a href="/privacy.html">Privacy</a> &middot; <a href="/terms.html">Terms</a></p></footer>

<script>
var allLeads = [];
function exportLeads() {
  if (!allLeads.length) { alert('No leads to export'); return; }
  var csv = 'Address,Type,Price,Bedrooms,Status,Date\n';
  allLeads.forEach(function(l){
    var d = typeof l.data === 'string' ? JSON.parse(l.data||'{}') : (l.data||{});
    csv += (d.address||'')+','+(d.propertyType||'')+','+(d.price||0)+','+(d.bedrooms||0)+','+(l.status||'')+','+((l.created_at||'').split('T')[0]||'')+'\n';
  });
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = 'leads.csv'; a.click();
}
function renderLeads(leads) {
  var container = document.getElementById('leads-container');
  if (!leads.length) { container.innerHTML = ''; document.getElementById('no-leads').style.display = 'block'; return; }
  document.getElementById('no-leads').style.display = 'none';
  var html = '';
  for (var i = 0; i < leads.length; i++) {
    var l = leads[i];
    var d = typeof l.data === 'string' ? JSON.parse(l.data||'{}') : (l.data||{});
    var product = l.product || d.product || 'moving';
    var dateStr = l.created_at ? new Date(l.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '';
    var status = d.listingStatus || d.status || 'New';
    var pc = d.postcode || '';
    var badge = product === 'moving' ? 'MOVING' : product === 'probate' ? 'PROBATE' : product === 'newbusiness' ? 'NEW BIZ' : product === 'planning' ? 'PLANNING' : 'TENDER';
    var badgeColor = product === 'moving' ? '#0ea5e9' : product === 'probate' ? '#a855f7' : product === 'newbusiness' ? '#22c55e' : product === 'planning' ? '#f59e0b' : '#6366f1';

    if (product === 'newbusiness') {
      // Match email: business name first, then address, SIC, companies house link
      var biz = d.company || d.companyName || d.name || 'New Company';
      var incDate = d.incorporationDate || d.dateOfCreation || '';
      var incStr = incDate ? 'Incorporated ' + new Date(incDate).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '';
      var metaParts = [incStr, d.sicCode ? 'SIC: ' + d.sicCode : ''].filter(Boolean);
      var chLink = d.companyNumber ? '<a href="https://find-and-update.company-information.service.gov.uk/company/' + d.companyNumber + '" target="_blank" style="color:var(--accent);text-decoration:underline;font-size:11px">View on Companies House</a>' : '';
      html += '<div class="lead"><div><div style="display:inline-block;padding:2px 8px;border-radius:5px;background:' + badgeColor + '14;color:' + badgeColor + ';font-size:9px;font-weight:700;margin-bottom:4px">' + badge + '</div>' +
        '<div class="addr">' + biz + '</div>' +
        '<div class="meta">' + (d.address||'') + '</div>' +
        '<div class="meta">' + metaParts.join(' \u00b7 ') + (chLink ? ' \u00b7 ' + chLink : '') + '</div></div>' +
        '<div class="right"><span class="badge">' + status + '</span></div></div>';
    } else if (product === 'probate') {
      var pName = d.deceasedName || d.name || 'Probate Estate';
      var pAddr = d.deceasedAddress || d.address || '';
      var pMeta = [pAddr, d.dateOfDeath ? 'Died ' + new Date(d.dateOfDeath).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '', d.claimExpiry ? 'Claims by ' + new Date(d.claimExpiry).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : ''].filter(Boolean);
      var gazLink = d.noticeUrl ? '<a href="' + d.noticeUrl + '" target="_blank" style="color:var(--accent);text-decoration:underline;font-size:11px">View notice</a>' : '';
      html += '<div class="lead"><div><div style="display:inline-block;padding:2px 8px;border-radius:5px;background:' + badgeColor + '14;color:' + badgeColor + ';font-size:9px;font-weight:700;margin-bottom:4px">' + badge + '</div>' +
        '<div class="addr">' + pName + '</div>' +
        '<div class="meta">' + pMeta.join(' \u00b7 ') + (gazLink ? ' \u00b7 ' + gazLink : '') + '</div></div>' +
        '<div class="right"><span class="badge">' + status + '</span></div></div>';
    } else if (product === 'planning') {
      var planTitle = d.address || (d.description||'').substring(0,40) || 'Planning Application';
      var planDate = d.dateSubmitted || d.receivedDate || d.date_received || l.created_at || '';
      var planDateStr = planDate ? new Date(planDate).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '';
      var planMeta = [d.applicationType, d.status, planDateStr ? 'Received ' + planDateStr : '', d.council, d.reference ? 'Ref: ' + d.reference : ''].filter(Boolean);
      var planDesc = (d.proposal || d.description) ? '<div class="meta" style="margin-top:2px">' + (d.proposal || d.description).substring(0,150) + '</div>' : '';
      var planApplicant = d.applicant ? '<div class="meta" style="margin-top:2px">Applicant: ' + d.applicant + '</div>' : '';
      html += '<div class="lead"><div><div style="display:inline-block;padding:2px 8px;border-radius:5px;background:' + badgeColor + '14;color:' + badgeColor + ';font-size:9px;font-weight:700;margin-bottom:4px">' + badge + '</div>' +
        '<div class="addr">' + planTitle + '</div>' +
        '<div class="meta">' + planMeta.join(' \u00b7 ') + '</div>' + planDesc + planApplicant + '</div>' +
        '<div class="right"><span class="badge">' + status + '</span></div></div>';
    } else if (product === 'tenders') {
      var tendTitle = d.tenderTitle || d.title || 'Opportunity';
      var tendMeta = [d.buyer || d.contractingAuthority, d.contractValueLabel && d.contractValueLabel !== '&pound' ? d.contractValueLabel : '', d.closingDate ? 'Deadline ' + new Date(d.closingDate).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '', d.publishedDate ? 'Published ' + d.publishedDate : '', d.postcode].filter(Boolean);
      var tendLink = d.url ? '<a href="' + d.url + '" target="_blank" style="color:var(--accent);text-decoration:underline;font-size:11px">View tender</a>' : '';
      var tendDesc = d.description ? '<div class="meta" style="margin-top:2px">' + d.description.substring(0,120) + '</div>' : '';
      html += '<div class="lead"><div><div style="display:inline-block;padding:2px 8px;border-radius:5px;background:' + badgeColor + '14;color:' + badgeColor + ';font-size:9px;font-weight:700;margin-bottom:4px">' + badge + '</div>' +
        '<div class="addr">' + tendTitle + '</div>' +
        '<div class="meta">' + tendMeta.join(' \u00b7 ') + (tendLink ? ' \u00b7 ' + tendLink : '') + '</div>' + tendDesc + '</div>' +
        '<div class="right"><span class="badge">' + status + '</span></div></div>';
    } else {
      // moving / default
      var addr = d.address || d.title || 'Property';
      var town = d.town || d.city || '';
      var fullAddr = addr;
      var addrNoPartial = addr.replace(/[, ]*[A-Z]{1,2}[0-9][A-Z0-9]?[\s,]*$/i, '').replace(/[\s,]+$/, '');
      if (addrNoPartial && pc && addrNoPartial !== addr) fullAddr = addrNoPartial;
      if (town && fullAddr.toLowerCase().indexOf(town.toLowerCase()) === -1) fullAddr += ', ' + town;
      if (pc && fullAddr.toLowerCase().indexOf(pc.toLowerCase()) === -1) fullAddr += ', ' + pc;
      var rmLink = d.url ? '<a href="' + d.url + '" target="_blank" style="color:var(--accent);text-decoration:underline;font-size:11px">View on Rightmove</a>' : '';
      var moveMeta = [(d.bedrooms ? d.bedrooms+' bed' : ''), d.propertyType||'', d.agent||'', rmLink].filter(Boolean);
      html += '<div class="lead"><div><div style="display:inline-block;padding:2px 8px;border-radius:5px;background:' + badgeColor + '14;color:' + badgeColor + ';font-size:9px;font-weight:700;margin-bottom:4px">' + badge + '</div>' +
        '<div class="addr">' + fullAddr + '</div>' +
        '<div class="meta">' + moveMeta.join(' \u00b7 ') + '</div></div>' +
        '<div class="right"><div class="price">' + (d.price ? '\u00a3'+Number(d.price).toLocaleString() : '') + '</div><span class="badge ' + (status === 'SSTC' ? 'badge-sstc' : '') + '">' + status + '</span></div></div>';
    }
  }
  container.innerHTML = html;
}
function filterLeads() {
  var q = document.getElementById('search-input').value.toLowerCase();
  var status = document.getElementById('status-filter').value.toLowerCase();
  var date = document.getElementById('date-filter').value;
  var filtered = allLeads.filter(function(l){
    var d = typeof l.data === 'string' ? JSON.parse(l.data||'{}') : (l.data||{});
    var addr = (d.address||d.title||'').toLowerCase();
    var ls = (d.listingStatus||'').toLowerCase();
    if (q && !addr.includes(q)) return false;
    if (status && ls !== status) return false;
    if (date === 'today') { var t = new Date().toISOString().split('T')[0]; if (!(l.created_at||'').startsWith(t)) return false; }
    if (date === 'week') { var w = new Date(); w.setDate(w.getDate()-w.getDay()); var ws = w.toISOString().split('T')[0]; if ((l.created_at||'') < ws) return false; }
    if (date === 'month') { var m = new Date().toISOString().split('T')[0].substring(0,7); if (!(l.created_at||'').startsWith(m)) return false; }
    return true;
  });
  renderLeads(filtered);
}
function doLogout() {
  if (confirm('Log out of your dashboard?')) {
    try { localStorage.removeItem('mld_portal_session'); } catch(e) {}
    try { sessionStorage.clear(); } catch(e) {}
    window.location.href = '/portal/';
  }
}
(function(){
  var sd = localStorage.getItem('mld_portal_session');
  if (!sd) { window.location.href = '/portal/'; return; }
  var sess = JSON.parse(sd);
  var token = sess ? sess.token : null;
  if (!token) { window.location.href = '/portal/'; return; }
  var x = new XMLHttpRequest();
  x.open('GET', '/api/leads', true);
  x.setRequestHeader('Authorization', 'Bearer ' + token);
  x.onload = function() {
    try {
      var leads = JSON.parse(x.responseText);
      if (!Array.isArray(leads)) return;
      document.getElementById('leads-loading').style.display = 'none';
      allLeads = leads.sort(function(a,b){return(b.created_at||'').localeCompare(a.created_at||'');});
      var today = new Date().toISOString().split('T')[0];
      var tl = allLeads.filter(function(l){return (l.created_at||'').startsWith(today);});
      var ml = allLeads.filter(function(l){return (l.created_at||'').startsWith(today.substring(0,7));});
      document.getElementById('stat-today').textContent = tl.length;
      document.getElementById('stat-week').textContent = allLeads.length;
      document.getElementById('stat-month').textContent = ml.length;
      document.getElementById('stat-total').textContent = allLeads.length;
      renderLeads(allLeads);
    } catch(e) {}
  };
  x.send();
})();
</script>
</body></html>
