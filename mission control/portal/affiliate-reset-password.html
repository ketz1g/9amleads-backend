<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Affiliate Password Reset | 9amLeads</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f7f9fc;color:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;background:#ffffff;border:1px solid #e5e7eb;border-radius:20px;padding:40px 36px;text-align:center;box-shadow:0 10px 30px rgba(15,23,42,0.05)}
h1{font-size:22px;font-weight:800;font-family:'Outfit',sans-serif;margin-bottom:6px;color:#0f172a}
.sub{color:#64748b;font-size:14px;margin-bottom:28px;line-height:1.6}
.form-group{margin-bottom:16px;text-align:left}
.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:#475569;text-transform:uppercase;letter-spacing:.5px}
.form-group input{width:100%;padding:13px 16px;background:#f1f5f9;border:1px solid #e5e7eb;border-radius:10px;font-size:14px;font-family:inherit;color:#0f172a;transition:border-color .2s;outline:none}
.form-group input:focus{border-color:#0284c7;box-shadow:0 0 0 3px rgba(14,165,233,0.12)}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all .3s;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(14,165,233,0.25)}
.msg{font-size:13px;margin-top:12px;padding:10px 14px;border-radius:8px;display:none}
.msg-error{color:#dc2626;background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.15)}
.msg-success{color:#16a34a;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2)}
.footer-text{margin-top:20px;font-size:12px;color:#64748b}
.footer-text a{color:#0284c7;text-decoration:none}
.badge{display:inline-block;background:rgba(236,72,153,0.12);color:#db2777;border:1px solid rgba(236,72,153,0.3);border-radius:20px;padding:2px 10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px}
</style>
</head>
<body>
<div class="card" id="forgot-step" style="display:block">
<div class="badge">Affiliate</div>
<h1>Forgot Password</h1>
<p class="sub">Enter your affiliate account email and we'll send you a reset link.</p>
<div class="form-group"><label>Email Address</label><input type="email" id="forgot-email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')sendResetLink()"></div>
<div id="forgot-msg" class="msg"></div>
<button class="btn" onclick="sendResetLink()" id="forgot-btn">Send Reset Link</button>
<div class="footer-text"><a href="/portal/affiliate.html">Back to Affiliate Sign In</a></div>
</div>

<div class="card" id="reset-step" style="display:none">
<div class="badge">Affiliate</div>
<h1>Reset Password</h1>
<p class="sub">Enter your new password below.</p>
<div class="form-group"><label>New Password</label><div style="position:relative"><input type="password" id="reset-password" placeholder="Min 8 characters" minlength="8" style="padding-right:34px" onkeydown="if(event.key==='Enter')submitReset()"><span onclick="var p=document.getElementById('reset-password');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'\uD83D\uDC41':'Hide'" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:#64748b;cursor:pointer;user-select:none;font-weight:600">&#128065;</span></div></div>
<div id="reset-msg" class="msg"></div>
<button class="btn" onclick="submitReset()" id="reset-btn">Reset Password</button>
<div class="footer-text"><a href="/portal/affiliate.html">Back to Affiliate Sign In</a></div>
</div>

<script>
const API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? 'http://localhost:8012'
  : 'https://nineamleads-backend.onrender.com';

(function() {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  if (token) {
    document.getElementById('forgot-step').style.display = 'none';
    document.getElementById('reset-step').style.display = 'block';
  }
})();

async function sendResetLink() {
  var email = document.getElementById('forgot-email').value.trim().toLowerCase();
  var msg = document.getElementById('forgot-msg');
  var btn = document.getElementById('forgot-btn');
  msg.style.display = 'none';
  if (!email) { msg.textContent = 'Please enter your email address'; msg.className = 'msg msg-error'; msg.style.display = 'block'; return; }
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
  try {
    var r = await fetch(API + '/api/affiliate/forgot-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email }) });
    var d = await r.json();
    if (d.message || d.success) {
      msg.innerHTML = 'If an affiliate account exists with that email, a reset link will be sent.';
      if (d.reset_url) { msg.innerHTML += '<br><br>Or click directly: <a href="' + d.reset_url + '" style="color:#0284c7">Reset Password</a>'; }
      msg.className = 'msg msg-success'; msg.style.display = 'block';
      btn.innerHTML = '<i class="fas fa-check"></i> Link Sent';
    } else {
      msg.textContent = d.error || 'Something went wrong. Please try again.'; msg.className = 'msg msg-error'; msg.style.display = 'block';
      btn.disabled = false; btn.innerHTML = 'Send Reset Link';
    }
  } catch(e) {
    msg.textContent = 'Could not connect to server. Please try again.'; msg.className = 'msg msg-error'; msg.style.display = 'block';
    btn.disabled = false; btn.innerHTML = 'Send Reset Link';
  }
}

async function submitReset() {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var password = document.getElementById('reset-password').value;
  var msg = document.getElementById('reset-msg');
  var btn = document.getElementById('reset-btn');
  msg.style.display = 'none';
  if (!token) { msg.textContent = 'Invalid reset link. Please request a new one.'; msg.className = 'msg msg-error'; msg.style.display = 'block'; return; }
  if (!password || password.length < 8) { msg.textContent = 'Password must be at least 8 characters'; msg.className = 'msg msg-error'; msg.style.display = 'block'; return; }
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
  try {
    var r = await fetch(API + '/api/affiliate/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token, password: password }) });
    var d = await r.json();
    if (d.message) {
      msg.textContent = d.message + ' Redirecting to sign in...'; msg.className = 'msg msg-success'; msg.style.display = 'block';
      setTimeout(function() { window.location.href = '/portal/affiliate.html'; }, 2000);
    } else {
      msg.textContent = d.error || 'Reset failed. Please request a new link.'; msg.className = 'msg msg-error'; msg.style.display = 'block';
      btn.disabled = false; btn.innerHTML = 'Reset Password';
    }
  } catch(e) {
    msg.textContent = 'Could not connect to server. Please try again.'; msg.className = 'msg msg-error'; msg.style.display = 'block';
    btn.disabled = false; btn.innerHTML = 'Reset Password';
  }
}
</script>
</body></html>
