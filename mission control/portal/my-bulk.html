<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bulk Leads | 9amLeads</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--sky:#0ea5e9;--ink:#0a0f1e;--panel:#0f172a;--line:#1e293b;--text:#f1f5f9;--txt2:#94a3b8;--green:#22c55e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Outfit',system-ui,sans-serif;background:var(--ink);color:var(--text);min-height:100vh}
  .top{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);background:#0b1220}
  .logo{font-size:18px;font-weight:800;color:#fff;text-decoration:none}.logo span{color:var(--sky)}
  .wrap{max-width:980px;margin:0 auto;padding:20px}
  .title{font-size:24px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
  .sub{color:var(--txt2);font-size:13px;margin-bottom:18px}
  .btn{display:inline-block;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:8px 14px;border-radius:9px;border:0;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .bars{display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
  .bar-row .lbl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--txt2)}
  .bar-row .lbl b{color:var(--text)}
  .track{height:14px;background:#0b1220;border:1px solid var(--line);border-radius:99px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,#0ea5e9,#22c55e);border-radius:99px;transition:width .4s}
  .fill.green{background:linear-gradient(90deg,#16a34a,#4ade80)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;margin-top:14px}
  .chip{background:#0b1220;border:1px solid var(--line);border-radius:99px;padding:5px 12px;color:var(--txt2)}
  .chip b{color:#7dd3fc}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;font-size:12.5px;border-bottom:1px solid var(--line)}
  th{color:#7dd3fc;font-size:11px;text-transform:uppercase;letter-spacing:.6px;background:#0b1220}
  td{color:var(--text)}
  td small{color:var(--txt2)}
  .st{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px}
  .st.not{background:rgba(148,163,184,.12);color:#cbd5e1;border:1px solid var(--line)}
  .st.printer{background:rgba(14,165,233,.12);color:#7dd3fc;border:1px solid rgba(14,165,233,.35)}
  .st.out{background:rgba(250,204,21,.12);color:#fde047;border:1px solid rgba(250,204,21,.35)}
  .st.delivered{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.35)}
  .st.failed{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.35)}
  .pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px;font-size:13px;color:var(--txt2)}
  .empty{text-align:center;padding:40px;color:var(--txt2)}
</style>
</head>
<body>
<div class="top">
  <a class="logo" href="/portal/dashboard.html">9am<span>Leads</span></a>
  <a class="btn ghost" href="/portal/dashboard.html" style="margin-left:auto">Back to Dashboard</a>
</div>
<div class="wrap">
  <div class="title">= My Bulk Leads</div>
  <p class="sub" id="subtitle">Every lead you've bought in bulk or boost packs, with live dispatch status.</p>

  <div class="bars">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;align-items:center">
      <button class="btn ghost fbtn on" data-f="all" onclick="setFilter('all',this)">All</button>
      <button class="btn ghost fbtn" data-f="not_sent" onclick="setFilter('not_sent',this)">Not yet sent</button>
      <button class="btn ghost fbtn" data-f="sent" onclick="setFilter('sent',this)">Sent &amp; tracking</button>
      <select id="dateSel" onchange="STATE.date=this.value;STATE.page=1;load();" style="padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:13px">
        <option value="">View by date you bought</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <label style="font-size:12.5px;color:var(--txt2);display:flex;align-items:center;gap:6px"><input type="checkbox" id="selAll" onchange="toggleAll(this)"> Select all on this page</label>
      <button class="btn ghost" onclick="selectAllAll()">Select all (all results)</button>
      <button class="btn ghost" id="delSel" onclick="deleteSelected()" style="color:#f87171;border-color:rgba(248,113,113,.4)">Delete selected</button>
      <span id="selInfo" style="font-size:12px;color:var(--txt2)"></span>
    </div>
    <div class="bar-row">
      <div class="lbl"><span>Posted to printers</span><b id="postedTxt">0%</b></div>
      <div class="track"><div class="fill" id="postedFill" style="width:0%"></div></div>
    </div>
    <div class="bar-row">
      <div class="lbl"><span>Delivered</span><b id="deliveredTxt">0%</b></div>
      <div class="track"><div class="fill green" id="deliveredFill" style="width:0%"></div></div>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <table>
    <thead><tr><th style="width:26px"></th><th style="width:30px">#</th><th>Lead</th><th>Address</th><th style="width:110px">Postcode</th><th style="width:150px">Status</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">No bulk leads yet. Buy a pack from the Bulk Send section in your dashboard.</div>
  <div class="pager">
    <button class="btn ghost" id="prev">Prev</button>
    <span id="pageLabel"></span>
    <button class="btn ghost" id="next">Next</button>
  </div>
</div>
<script>
var API = window.location.hostname === 'localhost' ? 'http://localhost:8012' : '';
function tok(){ try { var s = localStorage.getItem('mld_portal_session') || localStorage.getItem('9am_token') || ''; if (!s) return ''; if (s.charAt(0) === '{') { var o = JSON.parse(s); if (o && o.token) return o.token; } return s; } catch (e) { return s || ''; } }
var STATE = { page: 1, status: 'all', date: '' };
function setFilter(f, el){ STATE.status = f; STATE.page = 1; document.querySelectorAll('.fbtn').forEach(function(b){ b.classList.toggle('on', b === el); }); load(); }
var SEL = {};
function toggleAll(cb){ document.querySelectorAll('.lk').forEach(function(b){ b.checked = cb.checked; if (cb.checked) SEL[b.value] = 1; }); if (!cb.checked) document.querySelectorAll('.lk').forEach(function(b){ delete SEL[b.value]; }); updateSelInfo(); }
function selectAllAll(){
  var q = 'page=1&per=100&status=' + STATE.status + '&date=' + STATE.date;
  fetch(API + '/api/direct-mail/my-bulk-leads?' + q, { headers: { 'Authorization': 'Bearer ' + tok() } })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.leads) return;
      d.leads.forEach(function(l){ SEL[String(l.id)] = 1; });
      var pages = d.totalPages || 1;
      var chain = Promise.resolve();
      for (var pg = 2; pg <= pages; pg++) {
        chain = chain.then(function(p){ return fetch(API + '/api/direct-mail/my-bulk-leads?page=' + p + '&per=100&status=' + STATE.status + '&date=' + STATE.date, { headers: { 'Authorization': 'Bearer ' + tok() } }).then(function(r){ return r.json(); }).then(function(x){ if (x && x.leads) x.leads.forEach(function(l){ SEL[String(l.id)] = 1; }); }); });
      }
      return chain.then(function(){ var s = document.getElementById('selAll'); if (s) s.checked = true; load(); });
    })
    .catch(function(){ alert('Could not select all - try again.'); });
}
function toggleOne(cb){ if (cb.checked) SEL[cb.value] = 1; else delete SEL[cb.value]; updateSelInfo(); }
function updateSelInfo(){ document.getElementById('selInfo').textContent = Object.keys(SEL).length ? Object.keys(SEL).length + ' selected' : ''; }
function deleteSelected(){
  var ids = Object.keys(SEL);
  if (!ids.length) { alert('Select leads to delete first.'); return; }
  if (!confirm('Delete ' + ids.length + ' selected bulk leads from your account? This removes them from your list.')) return;
  fetch(API + '/api/direct-mail/bulk-leads/delete', { method: 'POST', headers: ah(), body: JSON.stringify({ ids: ids }) })
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d && d.success) { alert('Removed ' + (d.removed || 0) + ' lead(s).'); SEL = {}; updateSelInfo(); load(); } else { alert((d && d.error) || 'Delete failed.'); } })
    .catch(function(){ alert('Delete failed - try again.'); });
}
function loadDates(){
  fetch(API + '/api/direct-mail/my-bulk-leads?meta=1&status=' + STATE.status, { headers: { 'Authorization': 'Bearer ' + tok() } })
    .then(function(r){ return r.json(); })
    .then(function(d){
      var sel = document.getElementById('dateSel');
      if (!sel || !d || !d.dates) return;
      var cur = STATE.date;
      sel.innerHTML = '<option value="">View by date you bought</option>' + d.dates.map(function(x){ return '<option value="' + x.date + '">' + x.date + ' (' + x.count + ' leads)</option>'; }).join('');
      sel.value = cur;
    }).catch(function(){});
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function load(){
  fetch(API + '/api/direct-mail/my-bulk-leads?page=' + STATE.page + '&per=25&status=' + STATE.status + '&date=' + STATE.date, { headers: { 'Authorization': 'Bearer ' + tok() } })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || d.success === false) { throw new Error((d && d.error) || 'failed'); }
      var c = d.counts || {};
      var postPct = c.posted_pct || 0, delPct = c.delivered_pct || 0;
      document.getElementById('postedTxt').textContent = postPct + '% (' + c.posted + ' of ' + c.total + ')';
      document.getElementById('postedFill').style.width = postPct + '%';
      document.getElementById('deliveredTxt').textContent = delPct + '% (' + c.delivered + ' of ' + c.total + ')';
      document.getElementById('deliveredFill').style.width = delPct + '%';
      document.getElementById('chips').innerHTML =
        '<span class="chip">Not yet sent <b>' + (c.not_sent || 0) + '</b></span>' +
        '<span class="chip">With the printers <b>' + (c.printer || 0) + '</b></span>' +
        '<span class="chip">Out for delivery <b>' + (c.out || 0) + '</b></span>' +
        '<span class="chip">Delivered <b>' + (c.delivered || 0) + '</b></span>' +
        (c.failed ? '<span class="chip">Failed <b>' + c.failed + '</b></span>' : '');
      var rows = d.leads || [];
      var tb = document.getElementById('rows'); 
      tb.innerHTML = ''; 
      document.getElementById('empty').style.display = rows.length ? 'none' : 'block'; 
      var base = (d.page - 1) * (d.per || 25); 
      var lastDate = '';
      rows.forEach(function(l, i){ 
        var dd = String(l.reserved_at || '').slice(0, 10);
        if (!STATE.date && dd && dd !== lastDate) {
          var dh = document.createElement('tr');
          dh.innerHTML = '<td colspan="6" style="padding:12px 12px 6px;font-weight:800;color:#0ea5e9;border-bottom:none;font-size:13px;background:transparent">Bought ' + dd + '</td>';
          tb.appendChild(dh);
          lastDate = dd;
        }
        var tr = document.createElement('tr'); 
        var cls = l.status.key === 'delivered' ? 'delivered' : l.status.key === 'out' ? 'out' : l.status.key === 'printer' ? 'printer' : l.status.key === 'failed' ? 'failed' : 'not'; 
        tr.innerHTML = '<td><input type="checkbox" class="lk" value="' + esc(l.id) + '" onchange="toggleOne(this)"></td>' +
          '<td>' + (base + i + 1) + '</td>' + 
          '<td>' + esc(l.name) + (l.company ? ' <small> ' + esc(l.company) + '</small>' : '') + '</td>' + 
          '<td><small>' + esc(l.address) + '</small></td>' + 
          '<td>' + esc(l.postcode) + '</td>' + 
          '<td><span class="st ' + cls + '">' + esc(l.status.label) + '</span></td>'; 
        tb.appendChild(tr); 
      }); 
      document.querySelectorAll('.lk').forEach(function(b){ b.checked = !!SEL[b.value]; });
      updateSelInfo();
      loadDates();
      document.getElementById('pageLabel').textContent = 'Page ' + d.page + ' of ' + d.totalPages + ' (' + d.total + ' leads)';
      document.getElementById('prev').disabled = d.page <= 1;
      document.getElementById('next').disabled = d.page >= d.totalPages;
      document.getElementById('subtitle').textContent = "Every lead you've bought in bulk or boost packs, with live dispatch status.";
    })
    .catch(function(e){
      document.getElementById('rows').innerHTML = '';
      document.getElementById('pageLabel').textContent = '';
      document.getElementById('empty').style.display = 'block';
      document.getElementById('empty').textContent = 'Please sign in to view your bulk leads.';
    });
}
document.getElementById('prev').onclick = function(){ if (STATE.page > 1) { STATE.page--; load(); } };
document.getElementById('next').onclick = function(){ STATE.page++; load(); };
load();
</script>
</body>
</html>
