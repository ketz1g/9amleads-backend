<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email Templates | 9amLeads Admin</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"><style>:root{--bg:#0f111a;--bg2:#12141e;--card:#181b28;--card2:#1a1b2e;--border:rgba(255,255,255,0.06);--text:#f1f5f9;--text2:#94a3b8;--muted:#64748b;--muted2:#8890a8;--primary:#0ea5e9;--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--radius:10px;--ff-h:'Inter',-apple-system,sans-serif}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--ff-h);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}.container{max-width:1200px;margin:0 auto;padding:24px 20px}.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px}.logo{display:flex;align-items:center;gap:8px}.logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#0ea5e9,#6366f1);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900}.logo-text{font-size:18px;font-weight:900;color:var(--text)}.logo-text span{color:var(--primary)}.sub{color:var(--muted2);font-size:12px;margin-top:2px}.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;text-decoration:none;border:none;font-family:inherit}.btn-primary{background:linear-gradient(135deg,var(--primary),#6366f1);color:#fff}.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-sm{padding:6px 12px;font-size:11px}.btn-danger{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:var(--danger)}.btn-success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:var(--success)}.category{margin-bottom:12px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}.category-header{background:var(--bg2);padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--text);transition:.15s}.category-header:hover{background:var(--card)}.category-header .count{color:var(--muted);font-size:11px;font-weight:400;margin-left:auto}.category-body{display:none;background:var(--card2)}.email-item{padding:10px 16px 10px 40px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:12px;border-top:1px solid var(--border);transition:.15s}.email-item:hover{background:var(--card)}.email-item .eid{color:var(--muted);font-size:10px;width:110px;flex-shrink:0}.email-item .esubj{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}.email-item .eday{color:var(--muted2);font-size:10px;width:50px;text-align:right}.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:9px;font-weight:600}.badge-signup{background:rgba(14,165,233,0.1);color:#38bdf8}.badge-paid{background:rgba(99,102,241,0.1);color:#818cf8}.badge-outbound{background:rgba(16,185,129,0.1);color:#6ee7b7}.preview-panel{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:16px;display:none}.preview-panel .label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}.preview-panel .value{color:var(--text);font-size:13px;margin-bottom:12px;line-height:1.6}.preview-panel textarea{width:100%;min-height:200px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;font-family:monospace;font-size:12px;color:var(--text);resize:vertical;outline:none}.preview-panel textarea:focus{border-color:var(--primary)}.preview-panel input{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text);outline:none}.preview-panel input:focus{border-color:var(--primary)}.action-bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.loading{padding:20px;text-align:center;color:var(--muted2)}.empty{padding:30px;text-align:center;color:var(--muted)}#status{border-radius:6px;padding:8px 12px;font-size:11px;margin-top:8px;display:none}.tree-wrapper{max-height:calc(100vh - 200px);overflow-y:auto}.treename{font-size:11px;color:var(--muted);margin-bottom:8px;margin-top:16px;padding:0 4px;text-transform:uppercase;letter-spacing:1px}.treename:first-child{margin-top:0}.search-bar{width:100%;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);font-family:inherit;outline:none;margin-bottom:16px}.search-bar:focus{border-color:var(--primary)}@media(max-width:768px){.email-item{padding:10px 12px 10px 16px}.email-item .eid{width:80px;font-size:9px}.container{padding:16px 12px}.header{flex-direction:column;align-items:flex-start}}</style></head><body>
<div id="loginPage" style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px">
<div style="background:#12141e;border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:32px;max-width:400px;width:100%;text-align:center">
<div style="font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:900;color:#fff;margin-bottom:6px"><span style="display:inline-block;width:40px;height:40px;border-radius:10px;text-align:center;line-height:40px;font-size:18px;background:linear-gradient(135deg,#0ea5e9,#6366f1);margin-right:6px;vertical-align:middle">9</span><span style="vertical-align:middle">am Leads</span></div>
<p style="color:#94a3b8;font-size:13px;margin:4px 0 20px">Email Template Manager</p>
<p style="color:#ef4444;font-size:12px;margin-bottom:12px;display:none" id="loginError">Invalid password</p>
<input type="password" id="loginPass" placeholder="Admin password" style="width:100%;padding:12px 14px;background:#0f111a;border:1px solid rgba(255,255,255,0.1);border-radius:8px;font-size:14px;color:#f1f5f9;font-family:inherit;outline:none;margin-bottom:12px" onkeydown="if(event.key==='Enter')doLogin()">
<button class="btn btn-primary" onclick="doLogin()" style="width:100%;justify-content:center;padding:12px;font-size:14px"><i class="fas fa-lock"></i> Sign In</button>
</div>
</div>
<script>
function doLogin() {
  var pass = document.getElementById('loginPass').value;
  if (pass) { sessionStorage.setItem('9amAdminPass', pass); document.getElementById('loginPage').style.display = 'none'; document.getElementById('mainPage').style.display = 'block'; refreshList(); }
  else { document.getElementById('loginError').style.display = 'block'; }
}
</script>

<div class="container" id="mainPage" style="display:none">
<div class="header">
<div><div class="logo"><div class="logo-icon">9</div><div><div class="logo-text">9am<span>Leads</span> Email Manager</div><p class="sub">Manage all email templates &mdash; customer, paid, and outbound prospecting</p></div></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn btn-outline btn-sm" onclick="location.href='/portal/admin.html'"><i class="fas fa-arrow-left"></i> Admin</button>
<button class="btn btn-primary btn-sm" onclick="syncBrevo()"><i class="fas fa-upload"></i> Sync to Brevo</button>
<button class="btn btn-outline btn-sm" onclick="refreshList()"><i class="fas fa-sync"></i> Refresh</button>
</div>
</div>
<input type="text" class="search-bar" id="search" placeholder="Search templates by name, subject, or content..." oninput="filterList()">
<div id="status"></div>
<div id="templateList" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading templates...</div>
</div>
<script>
const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:8012' : 'https://www.9amleads.com';
function getPass() { try { return sessionStorage.getItem('9amAdminPass') || ''; } catch(e) { return ''; } }
function headers() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getPass() }; }
var allData = null; var currentId = null;

async function refreshList() {
  document.getElementById('templateList').innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading templates...</div>';
  try {
    var r = await fetch(API + '/api/admin/email-templates', { headers: headers() });
    var d = await r.json();
    if (!d || !d.success) { document.getElementById('templateList').innerHTML = '<div class="empty">Failed to load templates.</div>'; return; }
    allData = d;
    renderList(d.categories);
  } catch(e) { document.getElementById('templateList').innerHTML = '<div class="empty">Error: ' + e.message + '</div>'; }
}

function renderList(categories) {
  var html = '<div class="tree-wrapper">';
  for (var ci = 0; ci < categories.length; ci++) {
    var cat = categories[ci];
    var badgeClass = cat.key === 'signup' ? 'badge-signup' : (cat.key === 'paid' ? 'badge-paid' : 'badge-outbound');
    html += '<div class="category"><div class="category-header" onclick="toggleCat(this)"><span class="badge ' + badgeClass + '">' + cat.key.replace('outbound_','') + '</span>' + (cat.name || cat.key) + '<span class="count">' + (cat.emails ? cat.emails.length : 0) + '</span><i class="fas fa-chevron-down" style="font-size:10px;color:var(--muted);transition:.2s"></i></div><div class="category-body">';
    for (var ei = 0; ei < (cat.emails || []).length; ei++) {
      var e = cat.emails[ei];
      var dayLabel = e.day ? 'Day ' + e.day : (e.week ? 'Wk' + e.week : 'E' + e.emailNum || '');
      html += '<div class="email-item" onclick="loadTemplate(\'' + e.id + '\')" data-id="' + e.id + '"><span class="eid">' + e.id + '</span><span class="esubj">' + (e.subject || '').substring(0, 80) + '</span><span class="eday">' + dayLabel + '</span></div>';
    }
    html += '</div></div>';
  }
  html += '</div>';
  document.getElementById('templateList').innerHTML = html;
  if (currentId) document.querySelector('[data-id="' + currentId + '"]')?.classList.add('selected');
}

function toggleCat(el) {
  var body = el.nextElementSibling;
  var icon = el.querySelector('.fa-chevron-down');
  if (body.style.display === 'block') { body.style.display = 'none'; icon.style.transform = 'rotate(0deg)'; }
  else { body.style.display = 'block'; icon.style.transform = 'rotate(180deg)'; }
}

function filterList() {
  var q = document.getElementById('search').value.toLowerCase();
  if (!allData) return;
  var filtered = [];
  for (var ci = 0; ci < allData.categories.length; ci++) {
    var cat = allData.categories[ci];
    var match = cat.key.toLowerCase().includes(q) || (cat.name || '').toLowerCase().includes(q);
    var emails = (cat.emails || []).filter(function(e) { return e.id.toLowerCase().includes(q) || (e.subject || '').toLowerCase().includes(q) || (e.bodyPreview || '').toLowerCase().includes(q); });
    if (match) emails = cat.emails;
    if (emails.length > 0) filtered.push({ name: cat.name, key: cat.key, emails: emails });
  }
  renderList(filtered);
}

async function loadTemplate(id) {
  currentId = id;
  document.querySelectorAll('.email-item').forEach(function(el) { el.classList.remove('selected'); });
  var el = document.querySelector('[data-id="' + id + '"]');
  if (el) el.classList.add('selected');

  try {
    var r = await fetch(API + '/api/admin/email-templates/' + id, { headers: headers() });
    var d = await r.json();
    if (!d || !d.success) { setStatus('error', 'Failed to load template'); return; }
    showEditor(d.template);
  } catch(e) { setStatus('error', e.message); }
}

function showEditor(tpl) {
  var list = document.getElementById('templateList');
  var editHtml = '<div class="preview-panel" style="display:block">';

  // Subject
  editHtml += '<div class="label">Subject Line</div>';
  editHtml += '<input type="text" id="edit-subject" value="' + escapeHtml(tpl.subject || '') + '" onchange="markDirty()">';

  // Subject B (for outbound)
  if (tpl.subjectB) {
    editHtml += '<div class="label" style="margin-top:10px">A/B Subject Line</div>';
    editHtml += '<input type="text" id="edit-subjectB" value="' + escapeHtml(tpl.subjectB || '') + '" onchange="markDirty()">';
  }

  // Preview (for outbound)
  if (tpl.preview) {
    editHtml += '<div class="label" style="margin-top:10px">Preview Text</div>';
    editHtml += '<input type="text" id="edit-preview" value="' + escapeHtml(tpl.preview || '') + '" onchange="markDirty()">';
  }

  // CTA (for outbound)
  if (tpl.cta) {
    editHtml += '<div class="label" style="margin-top:10px">CTA</div>';
    editHtml += '<input type="text" id="edit-cta" value="' + escapeHtml(tpl.cta || '') + '" onchange="markDirty()">';
  }

  // Body
  editHtml += '<div class="label" style="margin-top:10px">Email Body</div>';
  editHtml += '<textarea id="edit-body" onchange="markDirty()">' + escapeHtml(tpl.body || '') + '</textarea>';

  // Action buttons
  editHtml += '<div class="action-bar">';
  editHtml += '<button class="btn btn-success btn-sm" onclick="saveTemplate(\'' + tpl.id + '\')"><i class="fas fa-save"></i> Save Changes</button>';
  editHtml += '<button class="btn btn-outline btn-sm" onclick="previewEmail(\'' + tpl.id + '\')"><i class="fas fa-eye"></i> Preview</button>';
  editHtml += '<span style="flex:1"></span>';
  editHtml += '<button class="btn btn-outline btn-sm" onclick="currentId=null;refreshList()"><i class="fas fa-times"></i> Close</button>';
  editHtml += '</div>';

  editHtml += '<div id="edit-status" style="margin-top:8px;font-size:11px;display:none"></div>';
  editHtml += '</div>';

  list.innerHTML = editHtml;
}

function escapeHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function markDirty() {
  var st = document.getElementById('edit-status');
  if (st) { st.textContent = 'Unsaved changes'; st.style.color = 'var(--warning)'; st.style.display = 'block'; }
}

async function saveTemplate(id) {
  var body = { subject: document.getElementById('edit-subject')?.value };
  var bodyEl = document.getElementById('edit-body');
  if (bodyEl) body.body = bodyEl.value;
  var subjB = document.getElementById('edit-subjectB');
  if (subjB) body.subjectB = subjB.value;
  var preview = document.getElementById('edit-preview');
  if (preview) body.preview = preview.value;
  var cta = document.getElementById('edit-cta');
  if (cta) body.cta = cta.value;

  try {
    var r = await fetch(API + '/api/admin/email-templates/' + id, { method: 'PUT', headers: headers(), body: JSON.stringify(body) });
    var d = await r.json();
    var st = document.getElementById('edit-status');
    if (d.success) { st.textContent = 'Saved successfully'; st.style.color = 'var(--success)'; st.style.display = 'block'; }
    else { st.textContent = 'Save failed: ' + (d.error || 'Unknown'); st.style.color = 'var(--danger)'; st.style.display = 'block'; }
  } catch(e) { setStatus('error', e.message); }
}

function previewEmail(id) {
  var bodyEl = document.getElementById('edit-body');
  if (!bodyEl) return;
  var w = window.open('', '_blank');
  if (!w) { alert('Please allow popups for preview'); return; }
  w.document.write(bodyEl.value);
  w.document.close();
}

async function syncBrevo() {
  setStatus('info', '<i class="fas fa-spinner fa-spin"></i> Syncing all templates to Brevo...');
  try {
    var r = await fetch(API + '/api/admin/email-templates/sync-brevo', { method: 'POST', headers: headers() });
    var d = await r.json();
    if (d.success) setStatus('success', 'Synced ' + d.templates + ' templates to Brevo (' + d.errors + ' errors)');
    else setStatus('error', 'Sync failed: ' + (d.error || 'Unknown'));
  } catch(e) { setStatus('error', e.message); }
}

function setStatus(type, msg) {
  var el = document.getElementById('status');
  el.style.display = 'block';
  el.style.background = type === 'success' ? 'rgba(34,197,94,0.08)' : type === 'error' ? 'rgba(239,68,68,0.08)' : 'rgba(14,165,233,0.08)';
  el.style.border = '1px solid ' + (type === 'success' ? 'rgba(34,197,94,0.2)' : type === 'error' ? 'rgba(239,68,68,0.2)' : 'rgba(14,165,233,0.2)');
  el.style.color = type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--danger)' : 'var(--primary)';
  el.innerHTML = msg;
}

// Init
if (getPass()) { document.getElementById('loginPage').style.display = 'none'; document.getElementById('mainPage').style.display = 'block'; refreshList(); }
</script></body></html>
