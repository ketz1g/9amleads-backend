services:
  - type: web
    name: 9amleads-api
    env: node
    region: frankfurt
    plan: starter
    buildCommand: npm install
    startCommand: node production_api_server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DOMAIN
        value: www.9amleads.com
      - key: SUPPORT_EMAIL
        value: hello@9amleads.com
      - key: API_PORT
        value: "8012"
      - key: JWT_SECRET
        sync: false
      - key: DB_PATH
        value: data/9amleads-prod.db
      - key: BREVO_API_KEY
        sync: false
      - key: COMPANIES_HOUSE_API_KEY
        sync: false
      - key: APIFY_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
