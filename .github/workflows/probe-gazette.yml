name: probe-gazette

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the Gazette from Actions IP
        run: |
          code=$(curl -s -o /tmp/gaz.html -w "%{http_code}" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36" "https://www.thegazette.co.uk/all-notices/notice?notice-type=deceased-estates&results-page-size=10&sort-by=latest-date")
          echo "Gazette HTTP: $code"
          echo "bytes: $(wc -c < /tmp/gaz.html)"
          grep -c 'notice/' /tmp/gaz.html || true
