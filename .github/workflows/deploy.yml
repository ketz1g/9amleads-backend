name: Deploy (gated out of the 9am window)

# Acts as "auto-deploy": every push to master deploys the backend — but if the push
# lands during the weekday 08:30-09:45 UK delivery window, the job WAITS until 09:45
# before triggering, so a deploy can never restart the server mid-9am-delivery.
on:
  push:
    branches: [ master ]
    # Only redeploy the backend when backend files change. Marketing-site pushes
    # (9amwebsite/**) are handled by the separate Netlify workflow and must NOT
    # restart the delivery server.
    paths:
      - 'mission control/**'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hold until outside the 08:30-09:45 UK delivery window
        run: |
          now_hm=$(TZ=Europe/London date +%H%M)
          dow=$(TZ=Europe/London date +%u)   # 1=Mon .. 7=Sun
          echo "UK time now: $(TZ=Europe/London date '+%a %d %b %H:%M')"
          if [ "$dow" -le 5 ] && [ "$now_hm" -ge 0830 ] && [ "$now_hm" -lt 0945 ]; then
            target=$(TZ=Europe/London date -d 'today 09:45' +%s)
            now=$(date +%s)
            wait=$(( target - now ))
            if [ "$wait" -gt 0 ]; then
              echo "Inside the 9am delivery window - holding ${wait}s until 09:45 UK"
              sleep "$wait"
            fi
          fi
          echo "Deploying at: $(TZ=Europe/London date '+%a %d %b %H:%M')"

      - name: Trigger Render deploy
        run: |
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys")
          echo "Render API HTTP $code"
          cat /tmp/resp.json
          # Render returns 202 (Accepted) for a successful deploy trigger, so accept ANY 2xx.
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Deploy trigger failed"; exit 1
          fi

      # SMOKE TEST: after the new build is live, run the delivery engine end-to-end in
      # test_only mode (internal test accounts, no real customers, no emails). If the
      # engine does not deliver the exact quota, fail the workflow - so "fix A breaks B"
      # is caught at deploy time, not at 9am.
      - name: Post-deploy smoke test (delivery rehearsal)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -e
          echo "Waiting for the new deploy to go live..."
          for i in $(seq 1 40); do
            status=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" \
              | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
            echo "  deploy status: ${status:-unknown}"
            if [ "$status" = "live" ]; then break; fi
            sleep 15
          done
          echo "Waiting for health endpoint..."
          for i in $(seq 1 25); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://nineamleads-backend.onrender.com/api/health" || true)
            echo "  health HTTP ${code:-none}"
            if [ "$code" = "200" ]; then break; fi
            sleep 6
          done
          echo "Running delivery rehearsal..."
          resp=$(curl -s -X POST "https://nineamleads-backend.onrender.com/api/admin/run-rehearsal" \
            -H "Authorization: Bearer $ADMIN_PASSWORD" \
            -H "Content-Type: application/json" -d '{"trigger":"post-deploy","quiet":true}')
          echo "$resp"
          echo "$resp" | grep -q '"ok":true' \
            || { echo "SMOKE TEST FAILED - the delivery engine did not pass the rehearsal"; exit 1; }
          echo "Smoke test passed - delivery engine delivers the exact quota."

      # Route deploy/smoke failures into the auto-fix agent (via the app's alert
      # endpoint, which then dispatches the agent). Works while the backend is up.
      - name: Dispatch agent on failure
        if: failure()
        env:
          GH_ALERT_TOKEN: ${{ secrets.GH_ALERT_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://api.github.com/repos/ketz1g/9amleads-backend/dispatches" \
            -H "Authorization: Bearer $GH_ALERT_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            -d "{\"event_type\":\"backend-alert\",\"client_payload\":{\"subject\":\"Deploy/smoke-test workflow FAILED\",\"text\":\"Run ${{ github.run_id }} failed. URL: https://github.com/ketz1g/9amleads-backend/actions/runs/${{ github.run_id }}\"}}" || echo 000)
          echo "dispatch HTTP $code"
          if [ "$code" != "204" ]; then
            curl -sS -X POST "https://nineamleads-backend.onrender.com/api/admin/alert" \
              -H "Authorization: Bearer $ADMIN_PASSWORD" -H "Content-Type: application/json" \
              -d "{\"subject\":\"Deploy/smoke-test workflow FAILED\",\"message\":\"Run ${{ github.run_id }} failed.\"}" || true
          fi
