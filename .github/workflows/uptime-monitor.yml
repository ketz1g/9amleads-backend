name: Uptime Monitor

on:
  schedule:
    # Every 5 minutes - check health endpoints externally (outside Render)
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check backend health (Render)
        id: health
        run: |
          HTTP_CODE=$(curl -s -o /tmp/backend_body.txt -w "%{http_code}" --max-time 30 "https://nineamleads-backend.onrender.com/api/health" || echo "000")
          echo "HTTP_CODE=$HTTP_CODE" >> $GITHUB_ENV
          # Collapse the body to ONE line. Writing a multi-line value to $GITHUB_ENV
          # fails the step, and during a deploy restart the error page is multi-line
          # HTML - which made this monitor cry outage when nothing was actually wrong.
          BODY=$(tr '\n\r' '  ' < /tmp/backend_body.txt | cut -c1-200)
          echo "BODY=$BODY" >> $GITHUB_ENV
          echo "Backend HTTP $HTTP_CODE"

      - name: Check public site (Netlify)
        id: site
        run: |
          SITE_CODE=$(curl -s -o /tmp/site_body.txt -w "%{http_code}" --max-time 30 "https://9amleads.com/" || echo "000")
          echo "SITE_CODE=$SITE_CODE" >> $GITHUB_ENV
          SITE_BODY=$(tr '\n\r' '  ' < /tmp/site_body.txt | cut -c1-200)
          echo "SITE_BODY=$SITE_BODY" >> $GITHUB_ENV
          echo "Site HTTP $SITE_CODE"

      - name: Determine outage
        id: status
        run: |
          # A deploy restart returns 502/503 for a short window. Treat those as
          # "deploying" rather than an outage, so a normal deploy does not page.
          if [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "503" ]; then
            echo "OUTAGE=deploying" >> $GITHUB_ENV
            echo "Backend briefly unavailable (HTTP $HTTP_CODE) - likely a deploy restart"
          elif [ "$HTTP_CODE" != "200" ] || [ "$SITE_CODE" != "200" ]; then
            echo "OUTAGE=yes" >> $GITHUB_ENV
            echo "Outage detected (backend=$HTTP_CODE, site=$SITE_CODE)"
          else
            echo "OUTAGE=no" >> $GITHUB_ENV
            echo "All systems operational"
          fi

      - name: Open alert issue if outage
        if: env.OUTAGE == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;
            const backend = process.env.HTTP_CODE;
            const site = process.env.SITE_CODE;
            const title = `🔴 9amLeads outage (backend HTTP ${backend}, site HTTP ${site})`;
            const issueBody = `**Outage detected.**\n\n- Backend (nineamleads-backend.onrender.com): HTTP **${backend}**\n- Public site (9amleads.com): HTTP **${site}**\n- Time: ${new Date().toISOString()}\n\nThis may affect the 09:00 lead delivery, daily emails, and the portal. Check the Render and Netlify dashboards.`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: ['uptime-alert'] });
            if (issues.some(i => i.title.includes('outage'))) {
              console.log('Alert already open, skipping.');
            } else {
              const issue = await github.rest.issues.create({ owner, repo, title, body: issueBody, labels: ['uptime-alert'] });
              console.log('Opened issue #' + issue.data.number);
            }

      - name: Dispatch agent on outage
        if: env.OUTAGE == 'yes'
        env:
          GH_ALERT_TOKEN: ${{ secrets.GH_ALERT_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          # Direct GitHub dispatch works even if the BACKEND IS DOWN. Fall back to the
          # app alert endpoint only if the dispatch token is missing/unusable.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://api.github.com/repos/ketz1g/9amleads-backend/dispatches" \
            -H "Authorization: Bearer $GH_ALERT_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            -d "{\"event_type\":\"backend-alert\",\"client_payload\":{\"subject\":\"Outage detected (backend $HTTP_CODE, site $SITE_CODE)\",\"text\":\"Uptime monitor outage detected at $(date -u).\"}}" || echo 000)
          echo "dispatch HTTP $code"
          if [ "$code" != "204" ]; then
            curl -sS -X POST "https://nineamleads-backend.onrender.com/api/admin/alert" \
              -H "Authorization: Bearer $ADMIN_PASSWORD" -H "Content-Type: application/json" \
              -d "{\"subject\":\"Outage detected (backend $HTTP_CODE, site $SITE_CODE)\",\"message\":\"The uptime monitor detected an outage.\"}" || true
          fi

      - name: Close alert issue if recovered
        if: env.OUTAGE == 'no'
        uses: actions/github-script@v7
        with:
          script: |
            const { repo, owner } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: ['uptime-alert'] });
            for (const issue of issues) {
              if (issue.title.includes('outage')) {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
                console.log('Closed issue #' + issue.number);
              }
            }
