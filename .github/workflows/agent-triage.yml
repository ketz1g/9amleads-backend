name: Agent triage (backend alert)

# Fired by the backend via a GitHub repository_dispatch when a 9amLeads alert goes
# out (sendAdminAlert -> _notifyAgent). The agent investigates, makes the smallest
# safe fix, runs checks, and opens a DRAFT pull request for a human to review/merge.
# It NEVER merges and never touches secrets.
on:
  repository_dispatch:
    types: [backend-alert]
  workflow_dispatch:
    inputs:
      subject:
        description: Alert subject
        required: false
      text:
        description: Alert details
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install opencode
        run: npm i -g opencode-ai

      - name: Investigate + fix (agent)
        env:
          # Provider auth for opencode (add ONE of these as a repo secret):
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SUBJECT: ${{ github.event.client_payload.subject || github.event.inputs.subject }}
          TEXT: ${{ github.event.client_payload.text || github.event.inputs.text }}
        run: |
          set -e
          MSG=$(cat <<EOF
          A 9amLeads backend alert just fired.

          SUBJECT: $SUBJECT
          DETAILS: $TEXT

          SCOPE: you may ONLY modify files under "mission control/" or "9amwebsite/".
          Never modify .github/, package files, secrets, or anything outside those two
          folders. Always leave a DRAFT PR for human review - never merge.

          Task:
          1. Investigate the code and find the ROOT CAUSE - do not guess.
          2. Make the smallest, safest fix (within the scope above).
          3. Run: node --check on any changed .js, and node test/*.js.
          4. Do NOT merge anything, do NOT touch secrets or credentials.
          5. If the fix is unclear or risky, open an ISSUE instead with your findings.
          6. Keep the change focused and explain it in the PR body.
          EOF
          )
          opencode run "$MSG" --auto --format json > /tmp/agent-out.json 2>/tmp/agent-err.txt || true
          echo "--- agent output (tail) ---"
          tail -c 4000 /tmp/agent-out.json || true

      - name: Auto-fix (merge) + notify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SUBJECT: ${{ github.event.client_payload.subject || github.event.inputs.subject }}
          TEXT: ${{ github.event.client_payload.text || github.event.inputs.text }}
        run: |
          set -e
          BODY="Triggered automatically by a 9amLeads backend alert.

          **Alert:** ${SUBJECT}
          **Details:** ${TEXT}

          The agent investigated, fixed it, and (if safe) merged it automatically."

          notify() {
            curl -sS -X POST "https://nineamleads-backend.onrender.com/api/admin/alert" \
              -H "Authorization: Bearer $ADMIN_PASSWORD" -H "Content-Type: application/json" \
              -d "{\"subject\":\"$1\",\"message\":\"$2\"}" || true
          }

          if [ -z "$(git status --porcelain)" ]; then
            echo "No code changes produced by the agent."
            notify "Auto-fix: no change needed (${SUBJECT})" "The agent investigated and found no code change was needed."
            exit 0
          fi

          FILES=$(git diff --name-only)
          echo "changed files:"; echo "$FILES"

          # SAFETY GATES before auto-merge (never deploy something reckless):
          #  1) only our two folders may change
          #  2) every changed .js must parse (never deploy a syntax error)
          #  3) small diff only (<=8 files, <=200 lines); bigger -> draft PR for review
          OPEN_DRAFT=0
          if echo "$FILES" | grep -qvE '^(mission control/|9amwebsite/)'; then
            echo "Out-of-scope path changed -> draft PR only."; OPEN_DRAFT=1
          fi
          for f in $(echo "$FILES" | grep '\.js$' || true); do
            node --check "$f" || { echo "Syntax error in $f -> draft PR only."; OPEN_DRAFT=1; break; }
          done
          NFILES=$(echo "$FILES" | grep -c . || true)
          LINES=$(git diff --numstat | awk '{s+=$1+$2} END {print s+0}')
          echo "files=$NFILES lines=$LINES"
          if [ "$NFILES" -gt 8 ] || [ "$LINES" -gt 200 ]; then echo "Diff too large -> draft PR only."; OPEN_DRAFT=1; fi

          BR="agent/auto-fix-$(date +%s)"
          git config user.name "9amleads-agent"
          git config user.email "agent@9amleads.com"
          git checkout -b "$BR"
          git add -A
          git commit -m "fix(auto): ${SUBJECT:-backend alert}"
          git push -u origin "$BR"

          if [ "$OPEN_DRAFT" = "1" ]; then
            gh pr create --title "Auto-fix (review): ${SUBJECT:-backend alert}" --body "$BODY

          _Held as a DRAFT because it failed a safety gate (scope/syntax/size)._ Safely merge after review." --head "$BR" --base master --draft
            notify "Auto-fix needs review (${SUBJECT})" "A bug was found; the fix failed a safety gate and was left as a DRAFT PR for review."
          else
            gh pr create --title "Auto-fix: ${SUBJECT:-backend alert}" --body "$BODY" --head "$BR" --base master
            gh pr merge "$BR" --squash --delete-branch
            echo "Auto-fixed and merged."
            notify "Auto-fixed: ${SUBJECT}" "A bug/error was found and fixed automatically, and the fix was merged to master (branch: ${BR}). No action needed."
          fi
