name: Deploy marketing site to Netlify

on:
  push:
    branches: [master]
    paths:
      - '9amwebsite/**'
      - 'netlify.toml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify secret is set
        run: |
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ]; then
            echo "::error::The NETLIFY_AUTH_TOKEN secret is EMPTY. Please create it in Settings -> Secrets and variables -> Actions -> New repository secret. Name must be exactly NETLIFY_AUTH_TOKEN."
            exit 1
          fi
          echo "Secret is set."

      - name: Deploy 9amwebsite to Netlify
        run: npx --yes netlify-cli deploy --prod --dir=9amwebsite --site lucent-lolly-e82191
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: lucent-lolly-e82191
