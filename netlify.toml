[build]
  publish = "9amwebsite"

[[redirects]]
  from = "/api/*"
  to = "https://nineamleads-backend.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/portal/*"
  to = "https://nineamleads-backend.onrender.com/portal/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://nineamleads-backend.onrender.com/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "https://nineamleads-backend.onrender.com/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/blog"
  to = "https://nineamleads-backend.onrender.com/blog"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "https://nineamleads-backend.onrender.com/blog/:splat"
  status = 200
  force = true

