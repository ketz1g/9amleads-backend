[build]
  publish = "publish"

[[redirects]]
  from = "/api/*"
  to = "https://nineamleads-backend.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/portal/*"
  to = "https://nineamleads-backend.onrender.com/portal/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://nineamleads-backend.onrender.com/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "https://nineamleads-backend.onrender.com/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/blog"
  to = "https://nineamleads-backend.onrender.com/blog"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "https://nineamleads-backend.onrender.com/blog/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' https://images.unsplash.com data:; connect-src 'self' https://nineamleads-backend.onrender.com"
